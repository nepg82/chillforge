<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chillforge</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="app-icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="app-icons/app-icon-512.png">
  <meta name="theme-color" content="#1e1e24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chillforge">

  <style>
    :root {
      --bg: #1e1e24;
      --card: #2b2b36;
      --accent: #d4a373;
      --text: #f4f4f6;
      --muted: #a0a0b0;
      --border: #3f3f4e;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      background-color: var(--card);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      color: var(--accent);
      letter-spacing: 1px;
    }
    h2 {
      margin: 0;
      font-size: 0.4rem;
      font-weight: 600;
      text-align: center;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      margin-top: 6px;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-group[hidden] { display: none; }
    #controls { display: flex; flex-direction: column; gap: 8px; }
    label {
      font-size: 0.85rem;
      font-weight: 600;
    }
    select {
      width: 100%;
      height: 44px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
    }
    button {
      background-color: var(--accent);
      color: #1a1a1a;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    button.playing { background-color: #e76f51; }

    /* Compact stepper / select rows: label | control */
    .row {
      display: grid;
      grid-template-columns: 4.6rem 44px 1fr 44px;
      gap: 8px;
      align-items: center;
    }
    .row.sel { grid-template-columns: 4.6rem 1fr; }
    .row .lbl { font-size: 0.85rem; font-weight: 600; text-align: right; }
    .step {
      height: 44px;
      padding: 0;
      font-size: 1.4rem;
      line-height: 1;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .step:disabled { opacity: 0.3; cursor: default; }
    .val {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chillforge</h1>
    <h2>261008-1458</h2>

    <button id="playBtn">Start Beat</button>

    <div class="control-group">
      <label for="styleSelect">Style</label>
      <select id="styleSelect"></select>
    </div>

    <div class="control-group">
      <label for="intensitySelect">Intensity</label>
      <select id="intensitySelect">
        <option value="study">Standard (Read / Study)</option>
        <option value="calm">Calm (Muted Drums, Soft Synth)</option>
        <option value="sleep">Sleep (No Drums, Ambient)</option>
      </select>
    </div>

    <div class="control-group" id="progGroup">
      <label for="progSelect">Chord Progression</label>
      <select id="progSelect"></select>
    </div>

    <!-- Tempo, mixer and shape selectors are built from the current style -->
    <div id="controls"></div>
  </div>

  <script>
    // ---------------------------------------------------------------
    // Data: progressions. Each chord is a list of notes.
    // ---------------------------------------------------------------
    const PROGRESSIONS = {
      jazz251: {
        label: "ii7 - V7 - Imaj7 - VI7 (Jazz Standard)",
        chords: [
          ["D3", "F3", "A3", "C4", "E4"],  // Dm9
          ["G3", "B3", "D4", "F4"],        // G7
          ["C3", "E3", "G3", "B3", "D4"],  // Cmaj9
          ["A3", "C#4", "E4", "G4"]        // A7
        ]
      },
      rising: {
        label: "Imaj9 - IImaj7 - iii7 - IVmaj7 (Rising Climb)",
        chords: [
          ["C3", "E3", "G3", "B3", "D4"],  // Cmaj9
          ["D3", "F#3", "A3", "C#4", "E4"],// Dmaj9 (Lydian lift)
          ["E3", "G3", "B3", "D4"],        // Em7
          ["F3", "A3", "C4", "E4"]         // Fmaj7
        ]
      },
      descending: {
        label: "IVmaj9 - iii7 - ii9 - Imaj9 (Descending Exhale)",
        chords: [
          ["F3", "A3", "C4", "E4", "G4"],  // Fmaj9
          ["E3", "G3", "B3", "D4"],        // Em7
          ["D3", "F3", "A3", "C4", "E4"],  // Dm9
          ["C3", "E3", "G3", "B3", "D4"]   // Cmaj9
        ]
      },
      turnaround: {
        label: "Imaj9 - vi9 - ii9 - V13 (Sunny Turnaround)",
        chords: [
          ["C3", "E3", "G3", "B3", "D4"],  // Cmaj9
          ["A2", "C3", "E3", "G3", "B3"],  // Am9
          ["D3", "F3", "A3", "C4", "E4"],  // Dm9
          ["F3", "G3", "B3", "E4"]         // G13
        ]
      },
      sway: {
        label: "Imaj9 - IVmaj9 (Two-Chord Sway)",
        chords: [
          ["C3", "E3", "G3", "B3", "D4"],  // Cmaj9
          ["E3", "G3", "B3", "D4", "G4"],  // Cmaj9 (open voicing)
          ["F3", "A3", "C4", "E4", "G4"],  // Fmaj9
          ["A3", "C4", "E4", "G4"]         // Fmaj9 (upper voicing)
        ]
      }
    };

    // ---------------------------------------------------------------
    // Styles: everything that differs between genres lives here.
    // The tempo row, mixer rows and shape selectors are generated from it.
    // ---------------------------------------------------------------
    const SHAPE_LABELS = {
      triangle: "Triangle (Warm/Soft)",
      softtri:  "Soft Triangle (Rounded/Mellow)",
      sine:     "Sine (Pure/Mellow)",
      sawtooth: "Sawtooth (Bright/Buzzy)",
      square:   "Square (Hollow/Retro)"
    };
    const shapeOpts = (order) => order.map((v) => [v, SHAPE_LABELS[v]]);

    const MASTER = { id: "master", label: "Master", max: 0, def: -6 };
    const VOL_MIN = -40;

    const STYLES = {
      chillwave: {
        label: "Chillwave",
        bpm: { min: 55, max: 95, def: 83 },
        swing: 0.16,                        // delay on off-16ths, fraction of a step
        progs: Object.keys(PROGRESSIONS),
        channels: [                         // mixer rows (Master is always added first)
          { id: "drums",  label: "Drums",  max: 6, def: 0 },
          { id: "pad",    label: "Pad",    max: 6, def: 0 },
          { id: "melody", label: "Melody", max: 6, def: 0 }
        ],
        selects: [                          // pulldowns under the mixer
          { id: "padShape",    label: "Pad",    def: "triangle",
            options: shapeOpts(["triangle", "softtri", "sine", "sawtooth", "square"]) },
          { id: "melodyShape", label: "Melody", def: "sine",
            options: shapeOpts(["sine", "softtri", "triangle", "sawtooth", "square"]) }
        ]
      }
    };

    // Intensity: master filter cutoff, drum level, melody density. Applies to every style.
    const INTENSITY = {
      study: { cutoff: 2500, drums: 1,    melody: 0.55 },
      calm:  { cutoff: 1200, drums: 0.45, melody: 0.4  },
      sleep: { cutoff: 450,  drums: 0,    melody: 0.25 }
    };

    // Waveform loudness compensation so shapes sit at similar levels.
    const SHAPE_LEVEL = { sine: 1.2, softtri: 1.1, triangle: 1, sawtooth: 0.4, square: 0.35 };

    const LOOKAHEAD = 0.2;     // seconds scheduled ahead of the audio clock
    const TICK_MS = 25;        // scheduler wake-up interval

    // ---------------------------------------------------------------
    // State
    // ---------------------------------------------------------------
    let ctx = null, g = null, noiseBuf = null, timer = null, silentEl = null;
    let playing = false;
    let step = 0, nextTime = 0, chordIdx = 0;
    let currentChord = null, lastMelodyNote = null;

    // Per-style settings (tempo, levels, pulldowns, progression), remembered separately.
    let styleKey = Object.keys(STYLES)[0];
    let intensityKey = "study";
    let inten = INTENSITY.study;
    const store = {};
    let S = null;                          // settings of the current style

    const $ = (id) => document.getElementById(id);
    const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const chanDefs = (st) => [MASTER, ...st.channels];

    // ---------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------
    const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    function noteFreq(name) {
      const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
      const midi = (parseInt(m[3], 10) + 1) * 12 + SEMI[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
      return 440 * Math.pow(2, (midi - 69) / 12);
    }
    // Custom waveform: sine plus triangle overtones at OVERTONE_MIX of full
    // strength (0 = sine, 1 = triangle). Built once, then reused.
    const OVERTONE_MIX = 0.5;
    const waveCache = {};
    function applyShape(osc, shape) {
      if (shape !== "softtri") { osc.type = shape; return; }
      if (!waveCache[shape]) {
        const N = 12, real = new Float32Array(N), imag = new Float32Array(N);
        imag[1] = 1;
        for (let h = 3; h < N; h += 2) {
          const sign = (((h - 1) / 2) % 2) ? -1 : 1;
          imag[h] = OVERTONE_MIX * sign / (h * h);
        }
        waveCache[shape] = ctx.createPeriodicWave(real, imag);
      }
      osc.setPeriodicWave(waveCache[shape]);
    }
    const dbToGain = (db) => (db <= VOL_MIN ? 0 : Math.pow(10, db / 20));
    const rand = (a, b) => a + Math.random() * (b - a);
    const stepDur = () => 60 / S.bpm / 4;

    // Scheduler tick from a Worker so it isn't throttled in background tabs.
    function makeTimer(cb, ms) {
      try {
        const src = "let id;onmessage=e=>{clearInterval(id);if(e.data==='start')id=setInterval(()=>postMessage(0)," + ms + ")}";
        const w = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
        w.onmessage = cb;
        return { start() { w.postMessage("start"); }, stop() { w.postMessage("stop"); } };
      } catch (e) {
        let id;
        return { start() { id = setInterval(cb, ms); }, stop() { clearInterval(id); } };
      }
    }

    // A real (non-empty) near-silent WAV so the OS treats the page as a media player.
    function makeSilentUrl() {
      const rate = 8000, n = rate * 10;            // 10 seconds, 16-bit mono
      const buf = new ArrayBuffer(44 + n * 2);
      const v = new DataView(buf);
      const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
      v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      w(36, "data"); v.setUint32(40, n * 2, true);
      for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, i % 2 ? 1 : -1, true);
      return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
    }
    function ensureSilentEl() {
      if (silentEl) return;
      silentEl = new Audio(makeSilentUrl());
      silentEl.loop = true;
      // If the OS/headset pauses the element directly, stop the beat to match.
      silentEl.addEventListener("pause", () => { if (playing) stopBeat(); });
    }

    // ---------------------------------------------------------------
    // Audio graph (built on Start, faded and dropped on Stop)
    // ---------------------------------------------------------------
    function initContext() {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC({ latencyHint: "playback" });

      // One shared noise buffer for snare + hats.
      const len = ctx.sampleRate;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

      timer = makeTimer(tick, TICK_MS);
      ctx.onstatechange = () => {
        if (playing && ctx.state !== "running") ctx.resume().catch(() => {});
      };
    }

    function buildGraph() {
      const n = {};
      n.out = ctx.createGain();
      n.out.gain.value = dbToGain(S.vol.master);
      n.comp = ctx.createDynamicsCompressor();   // safety limiter
      n.comp.threshold.value = -10;
      n.comp.ratio.value = 6;
      n.filter = ctx.createBiquadFilter();
      n.filter.type = "lowpass";
      n.filter.frequency.value = inten.cutoff;
      n.filter.connect(n.comp).connect(n.out).connect(ctx.destination);

      n.drums = ctx.createGain();  n.drums.connect(n.filter);
      n.pad = ctx.createGain();    n.pad.connect(n.filter);
      n.melody = ctx.createGain(); n.melody.connect(n.filter);

      // Pad tone shaping
      n.padFilter = ctx.createBiquadFilter();
      n.padFilter.type = "lowpass";
      n.padFilter.frequency.value = 1800;
      n.padFilter.connect(n.pad);

      // Shared drum filters
      n.snareBP = ctx.createBiquadFilter();
      n.snareBP.type = "bandpass"; n.snareBP.frequency.value = 2200; n.snareBP.Q.value = 0.7;
      n.snareBP.connect(n.drums);
      n.hatHP = ctx.createBiquadFilter();
      n.hatHP.type = "highpass"; n.hatHP.frequency.value = 7500;
      n.hatHP.connect(n.drums);

      // Melody echo (dotted eighth)
      n.delay = ctx.createDelay(2);
      n.delay.delayTime.value = 45 / S.bpm;
      const send = ctx.createGain(); send.gain.value = 0.3;
      const fb = ctx.createGain();   fb.gain.value = 0.38;
      const dLP = ctx.createBiquadFilter();
      dLP.type = "lowpass"; dLP.frequency.value = 1800;
      n.melody.connect(send).connect(n.delay).connect(dLP);
      dLP.connect(fb).connect(n.delay);
      dLP.connect(n.filter);

      g = n;
      applyMixer(true);
    }

    function teardownGraph() {
      const old = g;
      g = null;
      old.out.gain.setTargetAtTime(0, ctx.currentTime, 0.04);
      setTimeout(() => old.out.disconnect(), 400);
    }

    function applyMixer(instant) {
      if (!g) return;
      const t = ctx.currentTime, tc = instant ? 0.001 : 0.03;
      g.out.gain.setTargetAtTime(dbToGain(S.vol.master), t, tc);
      STYLES[styleKey].channels.forEach((c) => {
        const node = g[c.id];
        if (!node) return;
        const scale = c.id === "drums" ? inten.drums : 1;
        node.gain.setTargetAtTime(dbToGain(S.vol[c.id]) * scale, t, tc);
      });
      g.filter.frequency.setTargetAtTime(inten.cutoff, t, instant ? 0.001 : 0.15);
    }

    // ---------------------------------------------------------------
    // Voices
    // ---------------------------------------------------------------
    function playChord(t) {
      const chords = PROGRESSIONS[S.prog].chords;
      const chord = chords[chordIdx % chords.length];
      chordIdx++;
      currentChord = chord;

      const shape = S.sel.padShape;
      const dur = 16 * stepDur();
      const peak = (0.7 / chord.length) * SHAPE_LEVEL[shape];
      chord.forEach((note, i) => {
        const ts = t + i * 0.012;                    // slight strum
        const o = ctx.createOscillator();
        const gn = ctx.createGain();
        applyShape(o, shape);
        o.frequency.value = noteFreq(note);
        o.detune.value = rand(-6, 6);
        gn.gain.setValueAtTime(0.0001, ts);
        gn.gain.linearRampToValueAtTime(peak, ts + 0.18);
        gn.gain.setTargetAtTime(0, t + dur - 0.05, 0.25);
        o.connect(gn).connect(g.padFilter);
        o.start(ts);
        o.stop(t + dur + 1.6);
      });
    }

    function playMelody(t) {
      if (!currentChord) return;
      let note;
      do { note = currentChord[Math.floor(Math.random() * currentChord.length)]; }
      while (note === lastMelodyNote && currentChord.length > 1);
      lastMelodyNote = note;

      const shape = S.sel.melodyShape;
      const units = [1, 1, 1, 2, 2, 3, 4][Math.floor(Math.random() * 7)];
      const dur = units * stepDur();
      const peak = 0.2 * SHAPE_LEVEL[shape];

      const o = ctx.createOscillator();
      const gn = ctx.createGain();
      applyShape(o, shape);
      o.frequency.value = noteFreq(note) * 2;
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.linearRampToValueAtTime(peak, t + 0.03);
      gn.gain.setTargetAtTime(peak * 0.5, t + 0.03, 0.12);
      gn.gain.setTargetAtTime(0, t + dur, 0.12);
      o.connect(gn).connect(g.melody);
      o.start(t);
      o.stop(t + dur + 0.9);
    }

    function noiseHit(t, dest, level, decay) {
      const s = ctx.createBufferSource();
      const gn = ctx.createGain();
      s.buffer = noiseBuf;
      gn.gain.setValueAtTime(level, t);
      gn.gain.exponentialRampToValueAtTime(0.001, t + decay);
      s.connect(gn).connect(dest);
      s.start(t, Math.random() * 0.8);
      s.stop(t + decay + 0.02);
    }

    function kick(t, vel) {
      const o = ctx.createOscillator();
      const gn = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.exponentialRampToValueAtTime(0.55 * vel, t + 0.004);
      gn.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
      o.connect(gn).connect(g.drums);
      o.start(t);
      o.stop(t + 0.45);
    }

    function snare(t, vel) {
      noiseHit(t, g.snareBP, 0.55 * vel, 0.17);
      const o = ctx.createOscillator();
      const gn = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = 190;
      gn.gain.setValueAtTime(0.25 * vel, t);
      gn.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      o.connect(gn).connect(g.drums);
      o.start(t);
      o.stop(t + 0.1);
    }

    function hat(t, vel) {
      noiseHit(t, g.hatHP, 0.16 * vel, 0.04);
    }

    // ---------------------------------------------------------------
    // Scheduler (16 steps per bar, 4/4)
    // ---------------------------------------------------------------
    function scheduleStep(s, t) {
      const sd = stepDur();
      if (s % 2 === 1) t += sd * STYLES[styleKey].swing;   // swing the off-16ths

      if (s === 0) playChord(t);

      if (inten.drums > 0) {
        const jt = t + rand(-0.005, 0.005);      // human timing
        if (s === 0) kick(jt, 1);
        else if (s === 6 && Math.random() < 0.4) kick(jt, 0.8);
        else if (s === 10 && Math.random() < 0.35) kick(jt, 0.75);

        if (s === 4 || s === 12) snare(jt, rand(0.85, 1));

        if (s % 2 === 0) hat(jt, s % 4 === 2 ? rand(0.9, 1) : rand(0.4, 0.6));
        else if (Math.random() < 0.15) hat(jt, 0.3);
      }

      if (s % 2 === 0 && Math.random() < inten.melody) playMelody(t);
    }

    function tick() {
      if (!playing || !g) return;
      const now = ctx.currentTime;
      if (nextTime < now - 0.1) nextTime = now + 0.05;   // fell behind: resync, don't burst
      while (nextTime < now + LOOKAHEAD) {
        scheduleStep(step, nextTime);
        nextTime += stepDur();
        step = (step + 1) % 16;
      }
    }

    // ---------------------------------------------------------------
    // Settings: per-style memory, saved between visits
    // ---------------------------------------------------------------
    const SAVE_KEY = "chillforge-v3";

    function newState(key) {
      const st = STYLES[key];
      const vol = {};
      chanDefs(st).forEach((c) => { vol[c.id] = c.def; });
      const sel = {};
      st.selects.forEach((s) => { sel[s.id] = s.def; });
      return { bpm: st.bpm.def, vol, sel, prog: st.progs[0] };
    }

    // Copy any valid values from src into store[key]; ignore anything invalid.
    function mergeState(key, src) {
      if (!src) return;
      const st = STYLES[key], d = store[key];
      const bpm = Number(src.bpm);
      if (isFinite(bpm)) d.bpm = clamp(Math.round(bpm), st.bpm.min, st.bpm.max);
      chanDefs(st).forEach((c) => {
        const v = Number(src.vol && src.vol[c.id]);
        if (isFinite(v)) d.vol[c.id] = clamp(Math.round(v), VOL_MIN, c.max);
      });
      st.selects.forEach((s) => {
        const v = src.sel && src.sel[s.id];
        if (s.options.some((o) => o[0] === v)) d.sel[s.id] = v;
      });
      if (st.progs.includes(src.prog)) d.prog = src.prog;
    }

    function loadSettings() {
      Object.keys(STYLES).forEach((k) => { store[k] = newState(k); });
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
          const o = JSON.parse(raw);
          if (STYLES[o.style]) styleKey = o.style;
          if (INTENSITY[o.intensity]) intensityKey = o.intensity;
          Object.keys(STYLES).forEach((k) => mergeState(k, (o.store || {})[k]));
        } else {
          // One-time migration from the old slider-based settings.
          const old = JSON.parse(localStorage.getItem("chillforge-settings") || "null");
          if (old) {
            mergeState("chillwave", {
              bpm: old.bpmSlider, prog: old.progSelect,
              vol: { master: old.masterVol, drums: old.drumsVol, pad: old.padVol, melody: old.melodyVol },
              sel: { padShape: old.padShape, melodyShape: old.melodyShape }
            });
            if (INTENSITY[old.modeSelect]) intensityKey = old.modeSelect;
          }
        }
      } catch (e) {}
      S = store[styleKey];
      inten = INTENSITY[intensityKey];
    }

    let saveTimer = null;
    function saveSettings() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify({ style: styleKey, intensity: intensityKey, store }));
        } catch (e) {}
      }, 300);
    }

    // ---------------------------------------------------------------
    // UI: steppers (tap, or hold to repeat and speed up)
    // ---------------------------------------------------------------
    let holdStop = null;
    ["pointerup", "pointercancel"].forEach((ev) =>
      window.addEventListener(ev, () => { if (holdStop) holdStop(); }));

    function holdable(btn, fn) {
      btn.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 || btn.disabled) return;
        e.preventDefault();
        fn();
        let n = 0, to;
        const run = () => { fn(); n++; to = setTimeout(run, n > 12 ? 40 : 110); };
        to = setTimeout(run, 400);
        holdStop = () => { clearTimeout(to); holdStop = null; };
      });
      btn.addEventListener("click", (e) => { if (e.detail === 0) fn(); });   // keyboard
      btn.addEventListener("contextmenu", (e) => e.preventDefault());
    }

    function stepperRow(label, get, set, min, max, fmt) {
      const row = el("div", "row");
      const lbl = el("div", "lbl"); lbl.textContent = label;
      const dec = el("button", "step"); dec.textContent = "\u2212"; dec.setAttribute("aria-label", label + " down");
      const val = el("div", "val");
      const inc = el("button", "step"); inc.textContent = "+"; inc.setAttribute("aria-label", label + " up");
      const show = () => {
        val.textContent = fmt(get());
        dec.disabled = get() <= min;
        inc.disabled = get() >= max;
      };
      const bump = (d) => () => {
        const v = clamp(get() + d, min, max);
        if (v === get()) return;
        set(v); show(); saveSettings();
      };
      holdable(dec, bump(-1));
      holdable(inc, bump(1));
      show();
      row.append(lbl, dec, val, inc);
      return row;
    }

    const fmtDb = (v) => (v <= VOL_MIN ? "Off" : (v > 0 ? "+" : "") + v + " dB");

    function buildControls() {
      const st = STYLES[styleKey], box = $("controls");
      box.textContent = "";

      box.appendChild(stepperRow("Tempo", () => S.bpm, (v) => {
        S.bpm = v;
        if (g) g.delay.delayTime.setTargetAtTime(45 / S.bpm, ctx.currentTime, 0.05);
      }, st.bpm.min, st.bpm.max, String));

      const title = el("div", "section-title"); title.textContent = "Channel Mixer";
      box.appendChild(title);

      chanDefs(st).forEach((c) => {
        box.appendChild(stepperRow(c.label, () => S.vol[c.id], (v) => {
          S.vol[c.id] = v;
          applyMixer();
        }, VOL_MIN, c.max, fmtDb));
      });

      const sep = el("div", "section-title"); sep.textContent = "Sound";
      box.appendChild(sep);

      st.selects.forEach((s) => {
        const row = el("div", "row sel");
        const lbl = el("div", "lbl"); lbl.textContent = s.label;
        const sel = el("select");
        sel.setAttribute("aria-label", s.label + " sound");
        s.options.forEach(([v, text]) => {
          const o = el("option"); o.value = v; o.textContent = text; sel.appendChild(o);
        });
        sel.value = S.sel[s.id];
        sel.addEventListener("change", () => { S.sel[s.id] = sel.value; saveSettings(); });
        row.append(lbl, sel);
        box.appendChild(row);
      });
    }

    function fillProgressions() {
      const st = STYLES[styleKey], sel = $("progSelect");
      sel.textContent = "";
      st.progs.forEach((key) => {
        const o = el("option"); o.value = key; o.textContent = PROGRESSIONS[key].label; sel.appendChild(o);
      });
      sel.value = S.prog;
      $("progGroup").hidden = st.progs.length < 2;
    }

    function switchStyle(key) {
      styleKey = key;
      S = store[key];
      chordIdx = 0;
      buildControls();
      fillProgressions();
      applyMixer();
      if (g) g.delay.delayTime.setTargetAtTime(45 / S.bpm, ctx.currentTime, 0.05);
      saveSettings();
    }

    // ---------------------------------------------------------------
    // Transport
    // ---------------------------------------------------------------
    function startBeat() {
      if (playing) return;
      if (!ctx) initContext();
      ensureSilentEl();
      ctx.resume();
      silentEl.play().catch(() => {});
      buildGraph();
      step = 0; chordIdx = 0; currentChord = null; lastMelodyNote = null;
      nextTime = ctx.currentTime + 0.1;
      playing = true;
      timer.start();
      $("playBtn").textContent = "Stop Beat";
      $("playBtn").classList.add("playing");
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
    }

    function stopBeat() {
      if (!playing) return;
      playing = false;                 // set first so the element's pause listener is a no-op
      timer.stop();
      teardownGraph();
      if (silentEl) silentEl.pause();
      $("playBtn").textContent = "Start Beat";
      $("playBtn").classList.remove("playing");
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
    }

    // Beat is "playing" on paper but the audio died: rebuild without touching the silent element.
    function restartBeat() {
      playing = false;
      timer.stop();
      teardownGraph();
      startBeat();
    }

    $("playBtn").addEventListener("click", () => (playing ? stopBeat() : startBeat()));

    // ---------------------------------------------------------------
    // Init
    // ---------------------------------------------------------------
    loadSettings();

    const styleSelect = $("styleSelect");
    Object.keys(STYLES).forEach((key) => {
      const o = el("option"); o.value = key; o.textContent = STYLES[key].label; styleSelect.appendChild(o);
    });
    styleSelect.value = styleKey;
    styleSelect.addEventListener("change", (e) => switchStyle(e.target.value));

    $("intensitySelect").value = intensityKey;
    $("intensitySelect").addEventListener("change", (e) => {
      intensityKey = e.target.value;
      inten = INTENSITY[intensityKey];
      applyMixer();
      saveSettings();
    });

    $("progSelect").addEventListener("change", (e) => { S.prog = e.target.value; chordIdx = 0; saveSettings(); });

    buildControls();
    fillProgressions();

    // Bluetooth / lock-screen controls
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Chillforge",
          artist: "Generative lo-fi beat",
          artwork: [
            { src: "app-icons/app-icon-192.png", sizes: "192x192", type: "image/png" },
            { src: "app-icons/app-icon-512.png", sizes: "512x512", type: "image/png" }
          ]
        });
        navigator.mediaSession.setActionHandler("play", () => (playing ? restartBeat() : startBeat()));
        navigator.mediaSession.setActionHandler("pause", stopBeat);
        navigator.mediaSession.setActionHandler("stop", stopBeat);
      } catch (e) {}
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden || !playing) return;
      if (silentEl && silentEl.paused) { stopBeat(); return; }   // OS paused us: show the truth
      if (ctx.state !== "running") ctx.resume().catch(() => {});
    });

    // PWA: offline support / installability
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js")
          .catch((err) => console.warn("Service worker registration failed:", err));
      });
    }
  </script>
</body>
</html>
