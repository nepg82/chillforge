<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chillforge</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="app-icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="app-icons/app-icon-512.png">
  <meta name="theme-color" content="#1e1e24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chillforge">

  <style>
    :root {
      --bg: #1e1e24;
      --card: #2b2b36;
      --accent: #d4a373;
      --text: #f4f4f6;
      --muted: #a0a0b0;
      --border: #3f3f4e;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      background-color: var(--card);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      color: var(--accent);
      letter-spacing: 1px;
    }
    h2 {
      margin: 0;
      font-size: 0.7rem;
      font-weight: 600;
      text-align: center;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      margin-top: 4px;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-group[hidden] { display: none; }
    label {
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      width: 100%;
    }
    label span { color: var(--accent); }
    input[type=range], select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
    }
    input[type=range] { accent-color: var(--accent); padding: 0; height: 6px; cursor: pointer; }
    button {
      background-color: var(--accent);
      color: #1a1a1a;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    button.playing { background-color: #e76f51; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chillforge</h1>
    <h2>261008-1003</h2>

    <button id="playBtn">Start Beat</button>

    <div class="control-group">
      <label for="modeSelect">Vibe / Mode</label>
      <select id="modeSelect">
        <option value="study">Read / Study (Standard Beat)</option>
        <option value="calm">Calm Down (Muted Drums, Soft Synth)</option>
        <option value="sleep">Deep Calm / Sleep (No Drums, Ambient)</option>
      </select>
    </div>

    <!-- Filled from PROGRESSIONS below; hidden while only one exists -->
    <div class="control-group" id="progGroup">
      <label for="progSelect">Chord Progression</label>
      <select id="progSelect"></select>
    </div>

    <div class="control-group">
      <label for="bpmSlider">Tempo (BPM) <span id="bpmVal">83</span></label>
      <input type="range" id="bpmSlider" min="55" max="95" value="83">
    </div>

    <div class="section-title">Channel Mixer</div>

    <div class="control-group">
      <label for="masterVol">Master Volume <span id="masterVal">-6 dB</span></label>
      <input type="range" id="masterVol" min="-40" max="0" value="-6">
    </div>

    <div class="control-group">
      <label for="drumsVol">Drums Volume <span id="drumsVal">0 dB</span></label>
      <input type="range" id="drumsVol" min="-40" max="6" value="0">
    </div>

    <div class="control-group">
      <label for="padVol">Chords / Pad Volume <span id="padVal">0 dB</span></label>
      <input type="range" id="padVol" min="-40" max="6" value="0">
    </div>

    <div class="control-group">
      <label for="padShape">Chords / Pad Shape</label>
      <select id="padShape">
        <option value="triangle" selected>Triangle (Warm/Soft)</option>
        <option value="softtri">Soft Triangle (Rounded/Mellow)</option>
        <option value="sine">Sine (Pure/Mellow)</option>
        <option value="sawtooth">Sawtooth (Bright/Buzzy)</option>
        <option value="square">Square (Hollow/Retro)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="melodyVol">Melody Volume <span id="melodyVal">0 dB</span></label>
      <input type="range" id="melodyVol" min="-40" max="6" value="0">
    </div>

    <div class="control-group">
      <label for="melodyShape">Melody Shape</label>
      <select id="melodyShape">
        <option value="sine" selected>Sine (Pure/Mellow)</option>
        <option value="softtri">Soft Triangle (Rounded/Mellow)</option>
        <option value="triangle">Triangle (Warm/Soft)</option>
        <option value="sawtooth">Sawtooth (Bright/Buzzy)</option>
        <option value="square">Square (Hollow/Retro)</option>
      </select>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------
    // Data: add new progressions here. Each chord is a list of notes;
    // the dropdown appears automatically once there are two or more.
    // ---------------------------------------------------------------
    const PROGRESSIONS = {
      jazz251: {
        label: "ii7 - V7 - Imaj7 - VI7 (Jazz Standard)",
        chords: [
          ["D3", "F3", "A3", "C4", "E4"],  // Dm9
          ["G3", "B3", "D4", "F4"],        // G7
          ["C3", "E3", "G3", "B3", "D4"],  // Cmaj9
          ["A3", "C#4", "E4", "G4"]        // A7
        ]
      },
      rising: {
        label: "Imaj9 - IImaj7 - iii7 - IVmaj7 (Rising Climb)",
        chords: [
          ["C3", "E3", "G3", "B3", "D4"],  // Cmaj9
          ["D3", "F#3", "A3", "C#4", "E4"],// Dmaj9 (Lydian lift)
          ["E3", "G3", "B3", "D4"],        // Em7
          ["F3", "A3", "C4", "E4"]         // Fmaj7
        ]
      },
      descending: {
        label: "IVmaj9 - iii7 - ii9 - Imaj9 (Descending Exhale)",
        chords: [
          ["F3", "A3", "C4", "E4", "G4"],  // Fmaj9
          ["E3", "G3", "B3", "D4"],        // Em7
          ["D3", "F3", "A3", "C4", "E4"],  // Dm9
          ["C3", "E3", "G3", "B3", "D4"]   // Cmaj9
        ]
      },
      turnaround: {
        label: "Imaj9 - vi9 - ii9 - V13 (Sunny Turnaround)",
        chords: [
          ["C3", "E3", "G3", "B3", "D4"],  // Cmaj9
          ["A2", "C3", "E3", "G3", "B3"],  // Am9
          ["D3", "F3", "A3", "C4", "E4"],  // Dm9
          ["F3", "G3", "B3", "E4"]         // G13
        ]
      },
      sway: {
        label: "Imaj9 - IVmaj9 (Two-Chord Sway)",
        chords: [
          ["C3", "E3", "G3", "B3", "D4"],  // Cmaj9
          ["E3", "G3", "B3", "D4", "G4"],  // Cmaj9 (open voicing)
          ["F3", "A3", "C4", "E4", "G4"],  // Fmaj9
          ["A3", "C4", "E4", "G4"]         // Fmaj9 (upper voicing)
        ]
      }
    };

    // Per-mode settings: master filter cutoff, drum level, melody density.
    const MODES = {
      study: { cutoff: 2500, drums: 1,    melody: 0.55 },
      calm:  { cutoff: 1200, drums: 0.45, melody: 0.4  },
      sleep: { cutoff: 450,  drums: 0,    melody: 0.25 }
    };

    // Waveform loudness compensation so shapes sit at similar levels.
    const SHAPE_LEVEL = { sine: 1.2, softtri: 1.1, triangle: 1, sawtooth: 0.4, square: 0.35 };

    const SWING = 0.16;        // delay on off-16ths, as a fraction of a step
    const LOOKAHEAD = 0.2;     // seconds scheduled ahead of the audio clock
    const TICK_MS = 25;        // scheduler wake-up interval

    // ---------------------------------------------------------------
    // State
    // ---------------------------------------------------------------
    let ctx = null, g = null, noiseBuf = null, timer = null;
    let playing = false;
    let bpm = 83, step = 0, nextTime = 0, chordIdx = 0;
    let currentChord = null, lastMelodyNote = null;
    let progKey = Object.keys(PROGRESSIONS)[0];
    let mode = MODES.study;
    let padShape = "triangle", melodyShape = "sine";
    let silentEl = null;
    const vol = { master: -6, drums: 0, pad: 0, melody: 0 };

    const $ = (id) => document.getElementById(id);

    // ---------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------
    const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    function noteFreq(name) {
      const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
      const midi = (parseInt(m[3], 10) + 1) * 12 + SEMI[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
      return 440 * Math.pow(2, (midi - 69) / 12);
    }
    
    // A real (non-empty) 1-second silent WAV, so looping can't spin the main thread.
	function makeSilentUrl() {
	  const rate = 8000, n = rate * 10;            // 10 seconds, 16-bit mono
	  const buf = new ArrayBuffer(44 + n * 2);
	  const v = new DataView(buf);
	  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
	  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
	  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
	  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
	  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
	  w(36, "data"); v.setUint32(40, n * 2, true);
	
	  // Near-silent samples (about -90 dB) so the OS treats this as real audio.
	  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, i % 2 ? 1 : -1, true);

	  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
	}

	function ensureSilentEl() {
	  if (silentEl) return;
	  silentEl = new Audio(makeSilentUrl());
	  silentEl.loop = true;
	  // If the OS/headset pauses the element directly, stop the beat to match.
	  silentEl.addEventListener("pause", () => { if (playing) stopBeat(); });
	}
    
    // Custom waveform: sine plus triangle overtones at OVERTONE_MIX of full
    // strength (0 = sine, 1 = triangle). Built once, then reused.
    const OVERTONE_MIX = 0.5;
    const waveCache = {};
    function applyShape(osc, shape) {
      if (shape !== "softtri") { osc.type = shape; return; }
      if (!waveCache[shape]) {
        const N = 12, real = new Float32Array(N), imag = new Float32Array(N);
        imag[1] = 1;
        for (let h = 3; h < N; h += 2) {
          const sign = (((h - 1) / 2) % 2) ? -1 : 1;
          imag[h] = OVERTONE_MIX * sign / (h * h);
        }
        waveCache[shape] = ctx.createPeriodicWave(real, imag);
      }
      osc.setPeriodicWave(waveCache[shape]);
    }
    const dbToGain = (db) => (db <= -40 ? 0 : Math.pow(10, db / 20));
    const rand = (a, b) => a + Math.random() * (b - a);
    const stepDur = () => 60 / bpm / 4;

    // Scheduler tick from a Worker so it isn't throttled in background tabs.
    function makeTimer(cb, ms) {
      try {
        const src = "let id;onmessage=e=>{clearInterval(id);if(e.data==='start')id=setInterval(()=>postMessage(0)," + ms + ")}";
        const w = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
        w.onmessage = cb;
        return { start() { w.postMessage("start"); }, stop() { w.postMessage("stop"); } };
      } catch (e) {
        let id;
        return { start() { id = setInterval(cb, ms); }, stop() { clearInterval(id); } };
      }
    }

    // ---------------------------------------------------------------
    // Audio graph (built on Start, faded and dropped on Stop)
    // ---------------------------------------------------------------
    function initContext() {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC({ latencyHint: "playback" });

      // One shared noise buffer for snare + hats.
      const len = ctx.sampleRate;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

      timer = makeTimer(tick, TICK_MS);
      ctx.onstatechange = () => {
        if (playing && ctx.state !== "running") ctx.resume().catch(() => {});
      };
    }

    function buildGraph() {
      const n = {};
      n.out = ctx.createGain();
      n.out.gain.value = dbToGain(vol.master);
      n.comp = ctx.createDynamicsCompressor();   // safety limiter
      n.comp.threshold.value = -10;
      n.comp.ratio.value = 6;
      n.filter = ctx.createBiquadFilter();
      n.filter.type = "lowpass";
      n.filter.frequency.value = mode.cutoff;
      n.filter.connect(n.comp).connect(n.out).connect(ctx.destination);

      n.drums = ctx.createGain();  n.drums.connect(n.filter);
      n.pad = ctx.createGain();    n.pad.connect(n.filter);
      n.melody = ctx.createGain(); n.melody.connect(n.filter);

      // Pad tone shaping
      n.padFilter = ctx.createBiquadFilter();
      n.padFilter.type = "lowpass";
      n.padFilter.frequency.value = 1800;
      n.padFilter.connect(n.pad);

      // Shared drum filters
      n.snareBP = ctx.createBiquadFilter();
      n.snareBP.type = "bandpass"; n.snareBP.frequency.value = 2200; n.snareBP.Q.value = 0.7;
      n.snareBP.connect(n.drums);
      n.hatHP = ctx.createBiquadFilter();
      n.hatHP.type = "highpass"; n.hatHP.frequency.value = 7500;
      n.hatHP.connect(n.drums);

      // Melody echo (dotted eighth)
      n.delay = ctx.createDelay(2);
      n.delay.delayTime.value = 45 / bpm;
      const send = ctx.createGain(); send.gain.value = 0.3;
      const fb = ctx.createGain();   fb.gain.value = 0.38;
      const dLP = ctx.createBiquadFilter();
      dLP.type = "lowpass"; dLP.frequency.value = 1800;
      n.melody.connect(send).connect(n.delay).connect(dLP);
      dLP.connect(fb).connect(n.delay);
      dLP.connect(n.filter);

      g = n;
      applyMixer(true);
    }

    function teardownGraph() {
      const old = g;
      g = null;
      old.out.gain.setTargetAtTime(0, ctx.currentTime, 0.04);
      setTimeout(() => old.out.disconnect(), 400);
    }

    function applyMixer(instant) {
      if (!g) return;
      const t = ctx.currentTime, tc = instant ? 0.001 : 0.03;
      g.out.gain.setTargetAtTime(dbToGain(vol.master), t, tc);
      g.drums.gain.setTargetAtTime(dbToGain(vol.drums) * mode.drums, t, tc);
      g.pad.gain.setTargetAtTime(dbToGain(vol.pad), t, tc);
      g.melody.gain.setTargetAtTime(dbToGain(vol.melody), t, tc);
      g.filter.frequency.setTargetAtTime(mode.cutoff, t, instant ? 0.001 : 0.15);
    }

    // ---------------------------------------------------------------
    // Voices
    // ---------------------------------------------------------------
    function playChord(t) {
      const chords = PROGRESSIONS[progKey].chords;
      const chord = chords[chordIdx % chords.length];
      chordIdx++;
      currentChord = chord;

      const dur = 16 * stepDur();
      const peak = (0.7 / chord.length) * SHAPE_LEVEL[padShape];
      chord.forEach((note, i) => {
        const ts = t + i * 0.012;                    // slight strum
        const o = ctx.createOscillator();
        const gn = ctx.createGain();
        applyShape(o, padShape);
        o.frequency.value = noteFreq(note);
        o.detune.value = rand(-6, 6);
        gn.gain.setValueAtTime(0.0001, ts);
        gn.gain.linearRampToValueAtTime(peak, ts + 0.18);
        gn.gain.setTargetAtTime(0, t + dur - 0.05, 0.25);
        o.connect(gn).connect(g.padFilter);
        o.start(ts);
        o.stop(t + dur + 1.6);
      });
    }

    function playMelody(t) {
      if (!currentChord) return;
      let note;
      do { note = currentChord[Math.floor(Math.random() * currentChord.length)]; }
      while (note === lastMelodyNote && currentChord.length > 1);
      lastMelodyNote = note;

      const units = [1, 1, 1, 2, 2, 3, 4][Math.floor(Math.random() * 7)];
      const dur = units * stepDur();
      const peak = 0.2 * SHAPE_LEVEL[melodyShape];

      const o = ctx.createOscillator();
      const gn = ctx.createGain();
      applyShape(o, melodyShape);
      o.frequency.value = noteFreq(note) * 2;
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.linearRampToValueAtTime(peak, t + 0.03);
      gn.gain.setTargetAtTime(peak * 0.5, t + 0.03, 0.12);
      gn.gain.setTargetAtTime(0, t + dur, 0.12);
      o.connect(gn).connect(g.melody);
      o.start(t);
      o.stop(t + dur + 0.9);
    }

    function noiseHit(t, dest, level, decay) {
      const s = ctx.createBufferSource();
      const gn = ctx.createGain();
      s.buffer = noiseBuf;
      gn.gain.setValueAtTime(level, t);
      gn.gain.exponentialRampToValueAtTime(0.001, t + decay);
      s.connect(gn).connect(dest);
      s.start(t, Math.random() * 0.8);
      s.stop(t + decay + 0.02);
    }

    function kick(t, vel) {
      const o = ctx.createOscillator();
      const gn = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.exponentialRampToValueAtTime(0.55 * vel, t + 0.004);
      gn.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
      o.connect(gn).connect(g.drums);
      o.start(t);
      o.stop(t + 0.45);
    }

    function snare(t, vel) {
      noiseHit(t, g.snareBP, 0.55 * vel, 0.17);
      const o = ctx.createOscillator();
      const gn = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = 190;
      gn.gain.setValueAtTime(0.25 * vel, t);
      gn.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      o.connect(gn).connect(g.drums);
      o.start(t);
      o.stop(t + 0.1);
    }

    function hat(t, vel) {
      noiseHit(t, g.hatHP, 0.16 * vel, 0.04);
    }

    // ---------------------------------------------------------------
    // Scheduler (16 steps per bar, 4/4)
    // ---------------------------------------------------------------
    function scheduleStep(s, t) {
      const sd = stepDur();
      if (s % 2 === 1) t += sd * SWING;          // swing the off-16ths

      if (s === 0) playChord(t);

      if (mode.drums > 0) {
        const jt = t + rand(-0.005, 0.005);      // human timing
        if (s === 0) kick(jt, 1);
        else if (s === 6 && Math.random() < 0.4) kick(jt, 0.8);
        else if (s === 10 && Math.random() < 0.35) kick(jt, 0.75);

        if (s === 4 || s === 12) snare(jt, rand(0.85, 1));

        if (s % 2 === 0) hat(jt, s % 4 === 2 ? rand(0.9, 1) : rand(0.4, 0.6));
        else if (Math.random() < 0.15) hat(jt, 0.3);
      }

      if (s % 2 === 0 && Math.random() < mode.melody) playMelody(t);
    }

    function tick() {
      if (!playing || !g) return;
      const now = ctx.currentTime;
      if (nextTime < now - 0.1) nextTime = now + 0.05;   // fell behind: resync, don't burst
      while (nextTime < now + LOOKAHEAD) {
        scheduleStep(step, nextTime);
        nextTime += stepDur();
        step = (step + 1) % 16;
      }
    }

    // ---------------------------------------------------------------
    // UI wiring
    // ---------------------------------------------------------------
    const progSelect = $("progSelect");
    Object.keys(PROGRESSIONS).forEach((key) => {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = PROGRESSIONS[key].label;
      progSelect.appendChild(opt);
    });
    $("progGroup").hidden = Object.keys(PROGRESSIONS).length < 2;
    progSelect.addEventListener("change", (e) => { progKey = e.target.value; chordIdx = 0; });

	function startBeat() {
	  if (playing) return;
	  if (!ctx) initContext();
	  ensureSilentEl();
	  ctx.resume();
	  silentEl.play().catch(() => {});
	  buildGraph();
	  step = 0; chordIdx = 0; currentChord = null; lastMelodyNote = null;
	  nextTime = ctx.currentTime + 0.1;
	  playing = true;
	  timer.start();
	  $("playBtn").textContent = "Stop Beat";
	  $("playBtn").classList.add("playing");
	  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
	}

	function stopBeat() {
	  if (!playing) return;
	  playing = false;                 // set first so the element's pause listener is a no-op
	  timer.stop();
	  teardownGraph();
	  if (silentEl) silentEl.pause();
	  $("playBtn").textContent = "Start Beat";
	  $("playBtn").classList.remove("playing");
	  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
	}

	$("playBtn").addEventListener("click", () => (playing ? stopBeat() : startBeat()));

	// Bluetooth / lock-screen controls
	if ("mediaSession" in navigator) {
	  try {
	    navigator.mediaSession.metadata = new MediaMetadata({
	      title: "Chillforge",
	      artist: "Generative lo-fi beat",
	      artwork: [
	        { src: "app-icons/app-icon-192.png", sizes: "192x192", type: "image/png" },
	        { src: "app-icons/app-icon-512.png", sizes: "512x512", type: "image/png" }
	      ]
	    });
	    navigator.mediaSession.setActionHandler("play", startBeat);
	    navigator.mediaSession.setActionHandler("pause", stopBeat);
	    navigator.mediaSession.setActionHandler("stop", stopBeat);
	  } catch (e) {}
	}

    $("bpmSlider").addEventListener("input", (e) => {
      bpm = parseInt(e.target.value, 10);
      $("bpmVal").textContent = bpm;
      if (g) g.delay.delayTime.setTargetAtTime(45 / bpm, ctx.currentTime, 0.05);
    });

    ["master", "drums", "pad", "melody"].forEach((ch) => {
      $(ch + "Vol").addEventListener("input", (e) => {
        vol[ch] = parseFloat(e.target.value);
        $(ch + "Val").textContent = vol[ch] <= -40 ? "Off" : vol[ch] + " dB";
        applyMixer();
      });
    });

    $("padShape").addEventListener("change", (e) => { padShape = e.target.value; });
    $("melodyShape").addEventListener("change", (e) => { melodyShape = e.target.value; });
    $("modeSelect").addEventListener("change", (e) => { mode = MODES[e.target.value]; applyMixer(); });

    // Remember control positions between visits
    const SAVED_IDS = ["modeSelect", "progSelect", "bpmSlider", "masterVol", "drumsVol",
                       "padVol", "padShape", "melodyVol", "melodyShape"];
    function saveSettings() {
      try {
        const o = {};
        SAVED_IDS.forEach((id) => { o[id] = $(id).value; });
        localStorage.setItem("chillforge-settings", JSON.stringify(o));
      } catch (e) {}
    }
    function loadSettings() {
      try {
        const o = JSON.parse(localStorage.getItem("chillforge-settings") || "null");
        if (!o) return;
        SAVED_IDS.forEach((id) => {
          const el = $(id);
          if (o[id] === undefined) return;
          el.value = o[id];
          if (el.value !== String(o[id])) return;   // option no longer exists
          el.dispatchEvent(new Event(el.tagName === "SELECT" ? "change" : "input"));
        });
      } catch (e) {}
    }
    loadSettings();
    document.addEventListener("input", saveSettings);
    document.addEventListener("change", saveSettings);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && playing && ctx.state !== "running") ctx.resume().catch(() => {});
    });

    // PWA: offline support / installability
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js")
          .catch((err) => console.warn("Service worker registration failed:", err));
      });
    }
  </script>
</body>
</html>
