<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chillforge</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="app-icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="app-icons/app-icon-512.png">
  <meta name="theme-color" content="#1e1e24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chillforge">

  <style>
    :root {
      --bg: #1e1e24;
      --card: #2b2b36;
      --accent: #d4a373;
      --text: #f4f4f6;
      --muted: #a0a0b0;
      --border: #3f3f4e;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      background-color: var(--card);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      color: var(--accent);
      letter-spacing: 1px;
    }
    h2 {
      margin: 0;
      font-size: 0.7rem;
      font-weight: 600;
      text-align: center;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      margin-top: 6px;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-group[hidden] { display: none; }
    #controls { display: flex; flex-direction: column; gap: 8px; }
    label {
      font-size: 0.85rem;
      font-weight: 600;
    }
    select {
      width: 100%;
      height: 44px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
    }
    button {
      background-color: var(--accent);
      color: #1a1a1a;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    button.playing { background-color: #e76f51; }

    /* Compact stepper / select rows: label | control */
    .row {
      display: grid;
      grid-template-columns: 4.6rem 44px 1fr 44px;
      gap: 8px;
      align-items: center;
    }
    .row.sel { grid-template-columns: 4.6rem 1fr; }
    .row .lbl { font-size: 0.85rem; font-weight: 600; text-align: right; }

    /* Two-column stepper grid: label above, [-] value [+] below */
    .cells {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 14px;
    }
    .cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .cell .lbl { font-size: 0.8rem; font-weight: 600; text-align: center; color: var(--muted); }
    .ctl { display: grid; grid-template-columns: 44px 1fr 44px; gap: 6px; }
    .divider { grid-column: 1 / -1; border-top: 1px solid var(--border); margin: 4px 0 2px; }
    .step {
      height: 44px;
      padding: 0;
      font-size: 1.4rem;
      line-height: 1;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .step:disabled { opacity: 0.3; cursor: default; }
    .val {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
    }

    .radiorow { display: flex; gap: 8px; }
	.radiorow button { flex: 1; }
	.radiorow [hidden] { display: none; }
	button.alt { background: var(--bg); color: var(--accent); border: 1px solid var(--border); }
	button.alt.on { background: var(--accent); color: #1a1a1a; }
	#radioInfo { font-size: 0.75rem; color: var(--muted); text-align: center; min-height: 1em; }
	
	#dbg { font-size: .65rem; color: var(--muted); white-space: pre-wrap; max-height: 40vh; overflow: auto; margin: 0; }
	
  </style>
</head>
<body>
  <div class="container">
    <h1>Chillforge</h1>
    <h2 id="ver">261020-1218</h2>

    <button id="playBtn">Start Beat</button>
    
    <div class="radiorow">
	  <button id="radioBtn" class="alt">Radio: Off</button>
	  <button id="nextBtn" class="alt" hidden>Next Track ▸</button>
	</div>
	<div id="radioInfo"></div>

    <div class="control-group">
      <label for="styleSelect">Style</label>
      <select id="styleSelect"></select>
    </div>

    <div class="control-group" id="progGroup">
      <label for="progSelect">Chord Progression</label>
      <select id="progSelect"></select>
    </div>

    <!-- Tempo, mixer and shape selectors are built from the current style -->
    <div id="controls"></div>
    
    <pre id="dbg" hidden></pre>
    
  </div>

  <script>
    // ---------------------------------------------------------------
    // Data: progressions. Each chord is a list of notes.
    // ---------------------------------------------------------------
    const PROGRESSIONS = {
      jazz251: {
        label: "ii7 - V7 - Imaj7 - VI7 (Jazz Standard)",
        chords: [
          ["D3", "F3", "A3", "C4", "E4"],  // Dm9
          ["G3", "B3", "D4", "F4"],        // G7
          ["C3", "E3", "G3", "B3", "D4"],  // Cmaj9
          ["A3", "C#4", "E4", "G4"]        // A7
        ]
      },
      rising: {
        label: "Imaj9 - IImaj7 - iii7 - IVmaj7 (Rising Climb)",
        chords: [
          ["C3", "E3", "G3", "B3", "D4"],  // Cmaj9
          ["D3", "F#3", "A3", "C#4", "E4"],// Dmaj9 (Lydian lift)
          ["E3", "G3", "B3", "D4"],        // Em7
          ["F3", "A3", "C4", "E4"]         // Fmaj7
        ]
      },
      descending: {
        label: "IVmaj9 - iii7 - ii9 - Imaj9 (Descending Exhale)",
        chords: [
          ["F3", "A3", "C4", "E4", "G4"],  // Fmaj9
          ["E3", "G3", "B3", "D4"],        // Em7
          ["D3", "F3", "A3", "C4", "E4"],  // Dm9
          ["C3", "E3", "G3", "B3", "D4"]   // Cmaj9
        ]
      },
      turnaround: {
        label: "Imaj9 - vi9 - ii9 - V13 (Sunny Turnaround)",
        chords: [
          ["C3", "E3", "G3", "B3", "D4"],  // Cmaj9
          ["A2", "C3", "E3", "G3", "B3"],  // Am9
          ["D3", "F3", "A3", "C4", "E4"],  // Dm9
          ["F3", "G3", "B3", "E4"]         // G13
        ]
      },
      sway: {
        label: "Imaj9 - IVmaj9 (Two-Chord Sway)",
        chords: [
          ["C3", "E3", "G3", "B3", "D4"],  // Cmaj9
          ["E3", "G3", "B3", "D4", "G4"],  // Cmaj9 (open voicing)
          ["F3", "A3", "C4", "E4", "G4"],  // Fmaj9
          ["A3", "C4", "E4", "G4"]         // Fmaj9 (upper voicing)
        ]
      }
    };

    // ---------------------------------------------------------------
    // Styles: everything that differs between genres lives here.
    // The tempo row, mixer rows and shape selectors are generated from it.
    // ---------------------------------------------------------------
    Object.assign(PROGRESSIONS, {
      neon: {
        label: "i - VI - III - VII (Neon Drive)",
        chords: [
          ["A2", "E3", "A3", "C4"],        // Am
          ["F2", "C3", "F3", "A3"],        // F
          ["C3", "G3", "C4", "E4"],        // C
          ["G2", "D3", "G3", "B3"]         // G
        ]
      },
      andalusian: {
        label: "i - VII - VI - V (Andalusian Night)",
        chords: [
          ["A2", "E3", "A3", "C4"],        // Am
          ["G2", "D3", "G3", "B3"],        // G
          ["F2", "C3", "F3", "A3"],        // F
          ["E2", "B2", "E3", "G#3"]        // E
        ]
      },
      sunset: {
        label: "i - VI - III - VII (Sunset Strip)",
        chords: [
          ["D3", "A3", "D4", "F4"],        // Dm
          ["Bb2", "F3", "Bb3", "D4"],      // Bb
          ["F2", "C3", "F3", "A3"],        // F
          ["C3", "G3", "C4", "E4"]         // C
        ]
      },
      midnight: {
        label: "i - VI - III - VII (Midnight Run)",
        chords: [
          ["E2", "B2", "E3", "G3"],        // Em
          ["C3", "G3", "C4", "E4"],        // C
          ["G2", "D3", "G3", "B3"],        // G
          ["D3", "A3", "D4", "F#4"]        // D
        ]
      }
    });

    Object.assign(PROGRESSIONS, {
      phrygian: {
        label: "i - bII - i - bVII (Phrygian Dread)",
        chords: [
          ["E2", "B2", "E3", "G3"],        // Em
          ["F2", "C3", "F3", "A3"],        // F
          ["E2", "B2", "E3", "G3"],        // Em
          ["D2", "A2", "D3", "F#3"]        // D
        ]
      },
      pursuit: {
        label: "i - iv - VI - V (Harmonic Minor Pursuit)",
        chords: [
          ["A2", "E3", "A3", "C4"],        // Am
          ["D3", "A3", "D4", "F4"],        // Dm
          ["F2", "C3", "F3", "A3"],        // F
          ["E2", "B2", "E3", "G#3"]        // E
        ]
      },
      abyss: {
        label: "i - bVI - bVII - i (Abyss)",
        chords: [
          ["C3", "G3", "C4", "Eb4"],       // Cm
          ["Ab2", "Eb3", "Ab3", "C4"],     // Ab
          ["Bb2", "F3", "Bb3", "D4"],      // Bb
          ["C3", "G3", "C4", "Eb4"]        // Cm
        ]
      },
      chase: {
        label: "i - bVII - bVI - V (Midnight Chase)",
        chords: [
          ["G2", "D3", "G3", "Bb3"],       // Gm
          ["F2", "C3", "F3", "A3"],        // F
          ["Eb2", "Bb2", "Eb3", "G3"],     // Eb
          ["D3", "A3", "D4", "F#4"]        // D
        ]
      }
    });

    const SHAPE_LABELS = {
      triangle: "Triangle (Warm/Soft)",
      softtri:  "Soft Triangle (Rounded/Mellow)",
      sine:     "Sine (Pure/Mellow)",
      sawtooth: "Sawtooth (Bright/Buzzy)",
      square:   "Square (Hollow/Retro)"
    };
    const shapeOpts = (order) => order.map((v) => [v, SHAPE_LABELS[v]]);

    const MASTER = { id: "master", label: "Master", max: 0, def: -6 };
    const VOL_MIN = -40;

    const STYLES = {
      chillwave: {
        label: "Chillwave",
        bpm: { min: 55, max: 95, def: 83 },
        swing: 0.16,                        // delay on off-16ths, fraction of a step
        progs: ["jazz251", "rising", "descending", "turnaround", "sway"],
        lead: "melody", drums: "chill", jitter: 0.005,
        cutoffMul: 1, padCutoff: 1800, reverb: 0, echo: 0.3,
        channels: [                         // mixer rows (Master is always added first)
          { id: "drums",  label: "Drums",  max: 6, def: 0 },
          { id: "pad",    label: "Pad",    max: 6, def: 0 },
          { id: "melody", label: "Melody", max: 6, def: 0 }
        ],
        selects: [                          // pulldowns under the mixer
          { id: "padShape",    label: "Pad",    def: "triangle",
            options: shapeOpts(["triangle", "softtri", "sine", "sawtooth", "square"]),
            radio: ["triangle", "softtri", "sine"] },
          { id: "melodyShape", label: "Melody", def: "sine",
            options: shapeOpts(["sine", "softtri", "triangle", "sawtooth", "square"]),
            radio: ["sine", "softtri", "triangle"] }
        ]
      }
    };

    STYLES.synthwave = {
      label: "Synthwave",
      bpm: { min: 85, max: 125, def: 108 },
      swing: 0,
      progs: ["neon", "andalusian", "sunset", "midnight"],
      lead: "arp", drums: "synth", jitter: 0.002,
      bassPattern: "pulse", scenes: "synth",
      cutoffMul: 1.8, padCutoff: 2600, reverb: 0.35, echo: 0.25,
      channels: [
        { id: "drums", label: "Drums", max: 6, def: 0 },
        { id: "bass",  label: "Bass",  max: 6, def: -2 },
        { id: "pad",   label: "Pad",   max: 6, def: -3 },
        { id: "arp",   label: "Arp",   max: 6, def: -2 }
      ],
      selects: [
        { id: "padShape", label: "Pad", def: "super",
          options: [["super", "Supersaw (Wide/Lush)"], ["sawtooth", SHAPE_LABELS.sawtooth], ["softtri", SHAPE_LABELS.softtri]] },
        { id: "arpPattern", label: "Pattern", def: "up",
          options: [["up", "Up"], ["updown", "Up-Down"], ["down", "Down"],
          ["wander", "Wander (Random Walk)"], ["scatter", "Scatter (Fully Random)"]],
          radio: ["updown", "wander", "scatter"] },
        { id: "arpShape", label: "Lead", def: "sawtooth",
          options: shapeOpts(["sawtooth", "square", "softtri", "triangle", "sine"]) },
        { id: "variation", label: "Variation", def: "med",
          options: [["off", "Off (Steady Loop)"], ["low", "Rare (Auto Mute)"], ["med", "Occasional (Auto Mute)"], ["high", "Frequent (Auto Mute)"]] }
      ]
    };

    STYLES.darksynth = {
      label: "Darksynth",
      bpm: { min: 90, max: 135, def: 112 },
      swing: 0,
      progs: ["phrygian", "pursuit", "abyss", "chase"],
      lead: "arp", drums: "dark", jitter: 0.002,
      bassPattern: "gallop", scenes: "dark",
      arpEvery: 2,                          // arp plays eighths against the sixteenth-note bass
      drive: 5,                             // bass distortion amount (0 = clean)
      bassSweep: [380, 1200],               // bass filter sweeps lo -> hi -> lo across each phrase (Hz)
      cutoffMul: 1.5, padCutoff: 1500, reverb: 0.4, echo: 0.2,
      channels: [
        { id: "drums", label: "Drums", max: 6, def: 0 },
        { id: "bass",  label: "Bass",  max: 6, def: -4 },
        { id: "pad",   label: "Pad",   max: 6, def: -4 },
        { id: "arp",   label: "Arp",   max: 6, def: -3 }
      ],
      selects: [
        { id: "bassPattern", label: "Bassline", def: "gallop",
          options: [["gallop", "Gallop (Eighth + Two 16ths)"], ["driving", "Driving 16ths"],
                    ["octave", "Octave Bounce (16ths)"], ["pulse", "Pulse (Eighths)"]] },
        { id: "padShape", label: "Pad", def: "super",
          options: [["super", "Supersaw (Wide/Lush)"], ["sawtooth", SHAPE_LABELS.sawtooth], ["softtri", SHAPE_LABELS.softtri]] },
        { id: "arpPattern", label: "Pattern", def: "updown",
          options: [["up", "Up"], ["updown", "Up-Down"], ["down", "Down"],
          ["wander", "Wander (Random Walk)"], ["scatter", "Scatter (Fully Random)"]],
          radio: ["updown", "wander", "scatter"] },
        { id: "arpShape", label: "Lead", def: "sawtooth",
          options: shapeOpts(["sawtooth", "square", "softtri", "triangle", "sine"]) },
        { id: "variation", label: "Variation", def: "med",
          options: [["off", "Off (Steady Loop)"], ["low", "Rare (Auto Mute)"], ["med", "Occasional (Auto Mute)"], ["high", "Frequent (Auto Mute)"]] }
      ]
    };

    // Fixed tone settings (formerly the Intensity "Standard" preset).
    const CUTOFF = 2500;          // master lowpass cutoff (Hz), multiplied by the style's cutoffMul
    const MELODY_DENSITY = 0.55;  // chance of a melody note on each eighth (Chillwave)

    // Waveform loudness compensation so shapes sit at similar levels.
    const SHAPE_LEVEL = { sine: 1.2, softtri: 1.1, triangle: 1, sawtooth: 0.4, square: 0.35, super: 0.2 };

    // Bass patterns: step (0-15) -> null (rest) or { len: steps held, acc: accent, up: octave up }.
    const BASS_PATTERNS = {
      pulse:   (s) => (s % 2 === 0 ? { len: 2, acc: s % 4 === 0, up: (s / 2) % 4 === 3 } : null),
      gallop:  (s) => { const m = s % 4; return m === 1 ? null : { len: m === 0 ? 2 : 1, acc: m === 0, up: false }; },
      driving: (s) => ({ len: 1, acc: s % 4 === 0, up: false }),
      octave:  (s) => ({ len: 1, acc: s % 4 === 0, up: s % 2 === 1 })
    };

    // Variation (Synthwave and Darksynth): occasionally mute some channels for a few bars.
    // Decisions are made only at the start of a phrase (one pass through the progression).
    const VAR_LEVELS = { off: 0, low: 0.08, med: 0.15, high: 0.30 };   // chance per eligible phrase that a scene starts
    const VAR_BARS = [2, 4];      // possible scene lengths, in bars
    const VAR_SCENES = {          // channels muted in each scene, with relative weights (per style)
      synth: [
        { mute: ["drums"],         w: 3 },
        { mute: ["arp"],           w: 3 },
        { mute: ["pad"],           w: 2 },
        { mute: ["drums", "bass"], w: 1 },
        { mute: ["pad", "arp"],    w: 1 }
      ],
      dark: [
        { mute: ["drums"],         w: 3 },
        { mute: ["arp"],           w: 2 },
        { mute: ["pad"],           w: 2 },
        { mute: ["pad", "arp"],    w: 2 },   // rhythm section only
        { mute: ["drums", "bass"], w: 1 }
      ]
    };

    const LOOKAHEAD = 0.5;     // seconds scheduled ahead of the audio clock
    const TICK_MS = 50;        // scheduler wake-up interval

    // ---------------------------------------------------------------
    // State
    // ---------------------------------------------------------------
    let ctx = null, g = null, noiseBuf = null, timer = null, silentEl = null;
    let playing = false;
    
    // Diagnostic log: ring buffer in localStorage. Tap the version stamp to view/copy.
	const LOG_KEY = "chillforge-log";
	let LOG = [];
	let lastBeat = 0, resumeTries = 0, resumeTimer = null;
	let waitCount = 0, lastAliveTs = 0;
	let yielded = false, yieldTimer = null;
	const YIELD_GRACE_MS = 45000;
	
	try { LOG = JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); } catch (e) {}
	function log(msg) {
	  LOG.push(new Date().toLocaleString("sv-SE").slice(5) + " " + msg);
	  if (LOG.length > 1500) LOG.splice(0, LOG.length - 1500);
	  try { localStorage.setItem(LOG_KEY, JSON.stringify(LOG)); } catch (e) {}
	}
	const snap = () => "play=" + playing + " ctx=" + (ctx ? ctx.state : "-") +
	  " el=" + (silentEl ? (silentEl.paused ? "paused" : "playing") : "-") + " vis=" + document.visibilityState;
    
    let batt = null;
	try { navigator.getBattery().then((b) => { batt = b; }).catch(() => {}); } catch (e) {}
	const diag = () => " mem=" + (performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) + "MB" : "?") +
	  " bat=" + (batt ? Math.round(batt.level * 100) + (batt.charging ? "+" : "%") : "?") + " w=" + waitCount;
	function alive(why) {
	  try { localStorage.setItem("chillforge-alive", JSON.stringify({ t: Date.now(), p: playing, w: why })); } catch (e) {}
	}
	try {
	  const pv = JSON.parse(localStorage.getItem("chillforge-alive") || "null");
	  if (pv && pv.p) log("PREV SESSION ENDED WHILE PLAYING. last alive " +
	    new Date(pv.t).toLocaleString("sv-SE").slice(5) + " (" + pv.w + ") discarded=" + document.wasDiscarded);
	} catch (e) {}
	alive("boot");
    
    let step = 0, nextTime = 0, chordIdx = 0;
    let currentChord = null, lastMelodyNote = null;
    let arpK = 0, arpFreq = null, irBuf = null;   // arpFreq = last arp note played (Wander/Scatter memory)

    // Variation state: mute = array of muted channel ids (or null), bars = bars left in the scene,
    // skip = number of phrase-start decisions to pass on (first phrase and cooldown after a scene).
    const V = { mute: null, bars: 0, skip: 1 };
    
    const RADIO_SEC = [210, 390];
    const RADIO_STEP_CHOICES = [4, 8, 8];   // bars between each channel entering (intro) or dropping (outro); one is picked per channel
	const R = { on: false, base: null, n: 0, bar: 0, phase: "body", skip: false, mute: null,
	            intro: [], out: [], introBars: 0, ib: 0, gapBar: 0 };
	let refreshers = [], selEls = {};

    // Per-style settings (tempo, levels, pulldowns, progression), remembered separately.
    let styleKey = Object.keys(STYLES)[0];
    const store = {};
    let S = null;                          // settings of the current style

    const $ = (id) => document.getElementById(id);
    const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const chanDefs = (st) => [MASTER, ...st.channels];

    // ---------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------
    const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    function noteFreq(name) {
      const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
      const midi = (parseInt(m[3], 10) + 1) * 12 + SEMI[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
      return 440 * Math.pow(2, (midi - 69) / 12);
    }
    // Custom waveform: sine plus triangle overtones at OVERTONE_MIX of full
    // strength (0 = sine, 1 = triangle). Built once, then reused.
    const OVERTONE_MIX = 0.5;
    const waveCache = {};
    function applyShape(osc, shape) {
      if (shape !== "softtri") { osc.type = shape; return; }
      if (!waveCache[shape]) {
        const N = 12, real = new Float32Array(N), imag = new Float32Array(N);
        imag[1] = 1;
        for (let h = 3; h < N; h += 2) {
          const sign = (((h - 1) / 2) % 2) ? -1 : 1;
          imag[h] = OVERTONE_MIX * sign / (h * h);
        }
        waveCache[shape] = ctx.createPeriodicWave(real, imag);
      }
      osc.setPeriodicWave(waveCache[shape]);
    }
    // Synthetic reverb impulse: stereo noise with an exponential-ish decay.
    function makeIR(sec, decay) {
      const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = b.getChannelData(c);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      return b;
    }
    const dbToGain = (db) => (db <= VOL_MIN ? 0 : Math.pow(10, db / 20));
    const rand = (a, b) => a + Math.random() * (b - a);
    const stepDur = () => 60 / S.bpm / 4;

    // Scheduler tick from a Worker so it isn't throttled in background tabs.
    function makeTimer(cb, ms) {
      try {
        const src = "let id;onmessage=e=>{clearInterval(id);if(e.data==='start')id=setInterval(()=>postMessage(0)," + ms + ")}";
        const w = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
        w.onmessage = cb;
        return { start() { w.postMessage("start"); }, stop() { w.postMessage("stop"); } };
      } catch (e) {
        let id;
        return { start() { id = setInterval(cb, ms); }, stop() { clearInterval(id); } };
      }
    }

    // A real (non-empty) near-silent WAV so the OS treats the page as a media player.
    function makeSilentUrl() {
      const rate = 8000, n = rate * 10;            // 10 seconds, 16-bit mono
      const buf = new ArrayBuffer(44 + n * 2);
      const v = new DataView(buf);
      const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
      v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      w(36, "data"); v.setUint32(40, n * 2, true);
      for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, i % 2 ? 1 : -1, true);
      return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
    }

	function ensureSilentEl() {
	  if (silentEl) return;
	  silentEl = new Audio(makeSilentUrl());
	  silentEl.loop = true;
	  ["play", "pause", "ended", "error", "stalled"].forEach((ev) =>
	    silentEl.addEventListener(ev, () => log("el " + ev + " " + snap())));
	  silentEl.addEventListener("waiting", () => { waitCount++; });
	  silentEl.addEventListener("pause", onElPause);
	  silentEl.addEventListener("play", () => {
	    if (playing && yielded) { yielded = false; clearTimeout(yieldTimer); applyMixer(); log("unyield: el playing again"); }
	  });
	}

	function onElPause() {
	  if (!playing) return;
	  yielded = true; applyMixer();
	  log("yield: system paused el");
	  clearTimeout(yieldTimer);
	  yieldTimer = setTimeout(() => { if (playing && yielded) stopBeat("yielded to other audio"); }, YIELD_GRACE_MS);
	}

    // ---------------------------------------------------------------
    // Audio graph (built on Start, faded and dropped on Stop)
    // ---------------------------------------------------------------
    function initContext() {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC({ latencyHint: "playback" });

      // One shared noise buffer for snare + hats.
      const len = ctx.sampleRate;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

      timer = makeTimer(tick, TICK_MS);
      ctx.onstatechange = () => {
	    log("ctx " + ctx.state + " " + snap());
	    if (playing && ctx.state !== "running") ctx.resume().catch(() => {});
	  };
    }

    function buildGraph() {
      const n = {};
      n.out = ctx.createGain();
      n.out.gain.value = dbToGain(S.vol.master);
      const st = STYLES[styleKey];
      n.comp = ctx.createDynamicsCompressor();   // safety limiter
      n.comp.threshold.value = -10;
      n.comp.ratio.value = 6;
      n.filter = ctx.createBiquadFilter();
      n.filter.type = "lowpass";
      n.filter.frequency.value = CUTOFF * st.cutoffMul;
      n.filter.connect(n.comp).connect(n.out).connect(ctx.destination);

      n.drums = ctx.createGain();  n.drums.connect(n.filter);
      n.pad = ctx.createGain();    n.pad.connect(n.filter);
      n.melody = ctx.createGain(); n.melody.connect(n.filter);
      if (st.lead === "arp") {
        n.bass = ctx.createGain(); n.bass.connect(n.filter);
        n.arp = ctx.createGain();  n.arp.connect(n.filter);
        n.bassFilter = ctx.createBiquadFilter();
        n.bassFilter.type = "lowpass"; n.bassFilter.frequency.value = st.bassSweep ? st.bassSweep[0] : 650;
        n.bassFilter.Q.value = 3;
        n.bassFilter.connect(n.bass);
        n.bassIn = n.bassFilter;                     // bass notes enter here
        if (st.drive) {                              // distort first, then filter the result
          n.bassShaper = ctx.createWaveShaper();
          n.bassShaper.curve = driveCurve(st.drive);
          n.bassShaper.oversample = "2x";
          n.bassShaper.connect(n.bassFilter);
          n.bassIn = n.bassShaper;
        }
      }

	  else if (st.lead === "dub") { n.bass = ctx.createGain(); n.bass.connect(n.filter); }

      // Pad tone shaping
      n.padFilter = ctx.createBiquadFilter();
      n.padFilter.type = "lowpass";
      n.padFilter.frequency.value = st.padCutoff;
      n.padFilter.connect(n.pad);

      // Shared drum filters
      n.snareBP = ctx.createBiquadFilter();
      n.snareBP.type = "bandpass"; n.snareBP.frequency.value = 2200; n.snareBP.Q.value = 0.7;
      n.snareBP.connect(n.drums);
      n.hatHP = ctx.createBiquadFilter();
      n.hatHP.type = "highpass"; n.hatHP.frequency.value = 7500;
      n.hatHP.connect(n.drums);

      // Melody echo (dotted eighth)
      n.delay = ctx.createDelay(2);
      n.delay.delayTime.value = 45 / S.bpm;
      const send = ctx.createGain(); send.gain.value = st.echo;
      const fb = ctx.createGain();   fb.gain.value = 0.38;
      const dLP = ctx.createBiquadFilter();
      dLP.type = "lowpass"; dLP.frequency.value = 1800;
      if (n[st.lead]) n[st.lead].connect(send).connect(n.delay).connect(dLP);;
      dLP.connect(fb).connect(n.delay);
      dLP.connect(n.filter);

      if (st.reverb > 0) {
        if (!irBuf) irBuf = makeIR(2.2, 3);
        n.conv = ctx.createConvolver(); n.conv.buffer = irBuf;
        n.revSend = ctx.createGain(); n.revSend.gain.value = st.reverb;
        n.revSend.connect(n.conv).connect(n.filter);
        n.pad.connect(n.revSend); n.snareBP.connect(n.revSend);
        if (n.arp) n.arp.connect(n.revSend);
      }

      g = n;
      applyMixer(true);
    }

    // Soft-clip curve for the bass (cached per drive amount; output kept near the clean level).
    const driveCache = {};
    function driveCurve(k) {
      if (!driveCache[k]) {
        const n = 2048, c = new Float32Array(n);
        for (let i = 0; i < n; i++) c[i] = Math.tanh(k * ((i / (n - 1)) * 2 - 1)) * 0.35;
        driveCache[k] = c;
      }
      return driveCache[k];
    }

    function teardownGraph() {
      const old = g;
      g = null;
      old.out.gain.setTargetAtTime(0, ctx.currentTime, 0.04);
      setTimeout(() => old.out.disconnect(), 400);
    }

    function applyMixer(instant) {
      if (!g) return;
      const t = ctx.currentTime, tc = instant ? 0.001 : 0.03;
	  g.out.gain.setTargetAtTime(yielded ? 0 : dbToGain(S.vol.master), t, tc);
      STYLES[styleKey].channels.forEach((c) => {
        const node = g[c.id];
        if (!node) return;
        node.gain.setTargetAtTime(dbToGain(S.vol[c.id]), t, tc);
      });
      g.filter.frequency.setTargetAtTime(CUTOFF * STYLES[styleKey].cutoffMul, t, instant ? 0.001 : 0.15);
    }

    // ---------------------------------------------------------------
    // Variation: decided once per bar (step 0), by counting bars, never by wall-clock time.
    // Muting is done by skipping notes in the scheduler, not by touching gain nodes.
    // ---------------------------------------------------------------
    const muted = (ch) => { const m = (R.on && R.mute) || V.mute; return !!m && m.indexOf(ch) !== -1; };

    function resetVariation() {
      V.mute = null; V.bars = 0; V.skip = 1;   // first phrase always plays full
    }

    function pickScene(key) {
      const list = VAR_SCENES[key];
      let total = 0;
      list.forEach((sc) => { total += sc.w; });
      let r = Math.random() * total;
      for (const sc of list) {
        r -= sc.w;
        if (r < 0) return sc.mute;
      }
      return list[0].mute;
    }

    function updateVariation() {
      const st = STYLES[styleKey];
      const chance = st.scenes ? (VAR_LEVELS[S.sel.variation] || 0) : 0;
      if (chance === 0) {
        if (V.mute) resetVariation();
        return;
      }
      // Count down an active scene; when it ends, sit out the next phrase-start decision.
      if (V.mute && --V.bars <= 0) { V.mute = null; V.skip = 1; }

      const phraseLen = PROGRESSIONS[S.prog].chords.length;
      if (!V.mute && chordIdx % phraseLen === 0) {
        if (V.skip > 0) V.skip--;
        else if (Math.random() < chance) {
          V.mute = pickScene(st.scenes);
          V.bars = VAR_BARS[Math.floor(Math.random() * VAR_BARS.length)];
        }
      }
    }

	const progName = (k) => (PROGRESSIONS[k].label.match(/\(([^)]+)\)/) || [0, k])[1];

	function radioClone(base) {      // vol is shared; bpm/sel/prog are the radio's own copy
	  R.base = base;
	  return { bpm: base.bpm, vol: base.vol, sel: Object.assign({}, base.sel), prog: base.prog };
	}

	function radioPlan() {
	  const ids = STYLES[styleKey].channels.map((c) => c.id);
	  const P = PROGRESSIONS[S.prog].chords.length;
	  const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
	  const sched = (ord) => { let at = 0; const list = ord.map((ch) => { const e = { ch, at }; at += RADIO_STEP_CHOICES[Math.floor(Math.random() * RADIO_STEP_CHOICES.length)]; return e; }); return { list, end: at }; };

	  const lastIn = Math.random() < 0.5 ? "pad" : "drums";      // last to enter
	  const inOrd = shuf(ids.filter((c) => c !== lastIn));
	  if (inOrd[0] === "drums") { const j = inOrd.length - 1; [inOrd[0], inOrd[j]] = [inOrd[j], inOrd[0]]; }
	  inOrd.push(lastIn);

	  const outOrd = shuf(ids), L = outOrd.length - 1;          // drums never the last one left
	  if (outOrd[L] === "drums") { const j = Math.floor(Math.random() * L); [outOrd[j], outOrd[L]] = [outOrd[L], outOrd[j]]; }

	  const si = sched(inOrd), so = sched(outOrd), outBars = so.list[L].at;
	  R.intro = si.list; R.introBars = si.end; R.out = so.list;
	  const total = rand(RADIO_SEC[0], RADIO_SEC[1]) / (16 * stepDur());
	  R.ib = Math.max(Math.ceil((R.introBars + P) / P) * P, Math.round((total - outBars - 1) / P) * P);
	  R.gapBar = R.ib + outBars;                                 // the silent bar
	  R.bar = 0;
	}

	function radioNewTrack(first) {
	  const st = STYLES[styleKey];
	  if (!first) {
	    const ps = st.progs.filter((p) => p !== S.prog);
	    if (ps.length) S.prog = ps[Math.floor(Math.random() * ps.length)];
	    const up = Math.random() < clamp(0.5 + (st.bpm.def - S.bpm) / (st.bpm.max - st.bpm.min), 0.1, 0.9);
	    S.bpm = clamp(S.bpm + (up ? 1 : -1) * Math.round(rand(2, 5)), st.bpm.min, st.bpm.max);
	    st.selects.forEach((s) => {
	      if (s.id === "variation") return;
	      const pool = (s.radio || s.options.map((o) => o[0])).filter((v) => v !== S.sel[s.id]);
	      if (pool.length) S.sel[s.id] = pool[Math.floor(Math.random() * pool.length)];
	    });
	    if (g) g.delay.delayTime.setTargetAtTime(45 / S.bpm, ctx.currentTime, 0.05);
	  }
	  R.n++; chordIdx = 0;
	  radioPlan();
	  refreshers.forEach((f) => f());
	  Object.keys(selEls).forEach((id) => { selEls[id].value = S.sel[id]; });
	  $("progSelect").value = S.prog;
	  if ("mediaSession" in navigator) {
	    try {
	      const old = navigator.mediaSession.metadata;
	      navigator.mediaSession.metadata = new MediaMetadata({
	        title: STYLES[styleKey].label + " · " + progName(S.prog),
	        artist: S.bpm + " BPM · Radio",
	        artwork: old ? old.artwork : []
	      });
	    } catch (e) {}
	  }
	}

	function radioInfo() {
	  $("radioInfo").textContent = R.on ? (playing ? "Track " + R.n + " · " + R.phase : "Radio ready") : "";
	}

	// Called at every bar line (step 0) while Radio is on.
	function radioBar() {
	  if (R.skip) { R.skip = false; if (R.bar < R.gapBar) R.bar = R.gapBar; }
	  if (R.bar > R.gapBar) radioNewTrack(false);
	  const b = R.bar++;
	  chordIdx = b;
	  if (b < R.introBars) { R.phase = "intro"; R.mute = R.intro.filter((e) => e.at > b).map((e) => e.ch); }
	  else if (b >= R.ib) { R.phase = b < R.gapBar ? "outro" : "gap"; R.mute = R.out.filter((e) => e.at <= b - R.ib).map((e) => e.ch); }
	  else { R.phase = "body"; R.mute = null; }
	  if (R.mute) resetVariation(); else updateVariation();
	  radioInfo();
	}

	function setRadio(on) {
	  if (on === R.on) return;
	  R.on = on;
	  R.skip = false;
	  if (on) {
	    S = radioClone(S); R.n = 0;
	    if (playing) {                               // join mid-beat: new track, skipping its intro
	      radioNewTrack(true);
	      R.bar = Math.ceil(R.introBars / PROGRESSIONS[S.prog].chords.length) * PROGRESSIONS[S.prog].chords.length;
	    }
	  } else {
	    Object.assign(R.base, { bpm: S.bpm, prog: S.prog, sel: Object.assign({}, S.sel) });
	    S = R.base; R.mute = null; resetVariation(); saveSettings();
	  }
	  $("radioBtn").textContent = "Radio: " + (on ? "On" : "Off");
	  $("radioBtn").classList.toggle("on", on);
	  $("nextBtn").hidden = !on;
	  radioInfo();
	  if ("mediaSession" in navigator) {
	    try { navigator.mediaSession.setActionHandler("nexttrack", on ? () => { if (playing) R.skip = true; } : null); } catch (e) {}
	  }
	}

    // ---------------------------------------------------------------
    // Voices
    // ---------------------------------------------------------------
    // Always advances the chord (the bass and arp depend on it); the pad sound is optional.
    function playChord(t, withPad) {
      const chords = PROGRESSIONS[S.prog].chords;
      const pos = chordIdx % chords.length;
      const chord = chords[pos];
      chordIdx++;
      currentChord = chord;
      arpK = 0;

      // Bass filter: slow sweep lo -> hi -> lo across the phrase, one bar's slice at a time.
      const sweep = STYLES[styleKey].bassSweep;
      if (sweep && g.bassFilter) {
        const tri = (x) => 1 - Math.abs(2 * x - 1);
        const fr = (x) => sweep[0] * Math.pow(sweep[1] / sweep[0], tri(x));
        const bf = g.bassFilter.frequency;
        bf.cancelScheduledValues(t);
        bf.setValueAtTime(fr(pos / chords.length), t);
        bf.exponentialRampToValueAtTime(fr((pos + 1) / chords.length), t + 16 * stepDur());
      }
      if (!withPad) return;

      const shape = S.sel.padShape;
      const dur = 16 * stepDur();
      const peak = (0.7 / chord.length) * SHAPE_LEVEL[shape];
      chord.forEach((note, i) => {
        const ts = t + i * 0.012;                    // slight strum
        const dets = shape === "super" ? [-14, 0, 14] : [rand(-6, 6)];
        dets.forEach((dt) => {
          const o = ctx.createOscillator();
          const gn = ctx.createGain();
          applyShape(o, shape === "super" ? "sawtooth" : shape);
          o.frequency.value = noteFreq(note);
          o.detune.value = shape === "super" ? dt + rand(-3, 3) : dt;
          gn.gain.setValueAtTime(0.0001, ts);
          gn.gain.linearRampToValueAtTime(peak, ts + 0.18);
          gn.gain.setTargetAtTime(0, t + dur - 0.05, 0.25);
          o.connect(gn).connect(g.padFilter);
          o.start(ts);
          o.stop(t + dur + 1.6);
        });
      });
    }

    // Bass: sawtooth on the chord root, one octave below the pad's lowest note.
    // p comes from BASS_PATTERNS: { len, acc, up }.
    function playBass(t, p) {
      const sd = stepDur();
      let f = noteFreq(currentChord[0]) / 2;
      if (p.up) f *= 2;
      const dur = p.len * sd * 0.85;
      const peak = p.acc ? 0.34 : 0.26, atk = 0.008;
      const o = ctx.createOscillator();
      const gn = ctx.createGain();
      o.type = "sawtooth";
      o.frequency.value = f;
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.linearRampToValueAtTime(peak, t + atk);
      gn.gain.setTargetAtTime(peak * 0.55, t + atk, 0.08);
      gn.gain.setTargetAtTime(0, t + dur, 0.04);
      o.connect(gn).connect(g.bassIn);
      o.start(t);
      o.stop(t + dur + 0.3);
    }

    // Arp: walks through the chord's notes (two octaves up from the pad voicing).
    const poolCache = new WeakMap();
    function arpPool(chord) {
      let p = poolCache.get(chord);
      if (!p) {
        const fs = new Set();
        chord.forEach((n, i) => {
          const f = noteFreq(n);
          fs.add(+(f * 2).toFixed(2));
          if (i < 3) fs.add(+(f * 4).toFixed(2));
        });
        p = [...fs].sort((a, b) => a - b);
        poolCache.set(chord, p);
      }
      return p;
    }
    function arpIndex(pat, n, k) {
  if (pat === "down") return n - 1 - (k % n);
  if (pat === "updown") { const p = 2 * n - 2, m = k % p; return m < n ? m : p - m; }
  return k % n;
}

	// Wander / Scatter: pick the next pool index based on the last note played.
	function arpNext(pat, pool) {
	  const n = pool.length;
	  let i = -1;                                   // where the previous note sits in this chord's pool
	  if (arpFreq !== null) {
	    let best = Infinity;
	    pool.forEach((f, j) => {
	      const d = Math.abs(Math.log(f / arpFreq));
	      if (d < best) { best = d; i = j; }
	    });
	  }
	  if (i < 0) return Math.floor(Math.random() * n);
	
	  if (pat === "scatter") {
	    let j;
	    do { j = Math.floor(Math.random() * n); } while (j === i && n > 1);
	    return j;
	  }
	
	  // wander: mostly neighbors, sometimes a repeat, a skip, or a leap
	  const r = Math.random();
	  const dist = r < 0.50 ? 1 : r < 0.65 ? 0 : r < 0.90 ? 2 : 3 + Math.floor(Math.random() * 2);
	  const dir = Math.random() < 0.5 ? 1 : -1;
	  let j = i + dir * dist;
	  if (j < 0 || j >= n) j = i - dir * dist;      // bounce off the ends
	  return clamp(j, 0, n - 1);
	}

	function playArp(t, s) {
	  if (!currentChord) return;
	  const pool = arpPool(currentChord);
	  const pat = S.sel.arpPattern;
	  const f = (pat === "wander" || pat === "scatter")
	    ? pool[arpNext(pat, pool)]
	    : pool[arpIndex(pat, pool.length, arpK++)];
	  arpFreq = f;
	  const shape = S.sel.arpShape;
	  const every = STYLES[styleKey].arpEvery || 1;
	  const dur = every * stepDur() * 0.8;
	  const peak = 0.13 * SHAPE_LEVEL[shape] * (s % 4 === 0 ? 1 : 0.75);
	  const o = ctx.createOscillator();
	  const gn = ctx.createGain();
	  applyShape(o, shape);
	  o.frequency.value = f;
	  gn.gain.setValueAtTime(0.0001, t);
	  gn.gain.linearRampToValueAtTime(peak, t + 0.004);
	  gn.gain.setTargetAtTime(peak * 0.35, t + 0.004, 0.07);
	  gn.gain.setTargetAtTime(0, t + dur, 0.03);
	  o.connect(gn).connect(g.arp);
	  o.start(t);
	  o.stop(t + dur + 0.25);
	}

    function playMelody(t) {
      if (!currentChord) return;
      let note;
      do { note = currentChord[Math.floor(Math.random() * currentChord.length)]; }
      while (note === lastMelodyNote && currentChord.length > 1);
      lastMelodyNote = note;

      const shape = S.sel.melodyShape;
      const units = [1, 1, 1, 2, 2, 3, 4][Math.floor(Math.random() * 7)];
      const dur = units * stepDur();
      const peak = 0.2 * SHAPE_LEVEL[shape];

      const o = ctx.createOscillator();
      const gn = ctx.createGain();
      applyShape(o, shape);
      o.frequency.value = noteFreq(note) * 2;
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.linearRampToValueAtTime(peak, t + 0.03);
      gn.gain.setTargetAtTime(peak * 0.5, t + 0.03, 0.12);
      gn.gain.setTargetAtTime(0, t + dur, 0.12);
      o.connect(gn).connect(g.melody);
      o.start(t);
      o.stop(t + dur + 0.9);
    }

    function noiseHit(t, dest, level, decay) {
      const s = ctx.createBufferSource();
      const gn = ctx.createGain();
      s.buffer = noiseBuf;
      gn.gain.setValueAtTime(level, t);
      gn.gain.exponentialRampToValueAtTime(0.001, t + decay);
      s.connect(gn).connect(dest);
      s.start(t, Math.random() * 0.8);
      s.stop(t + decay + 0.02);
    }

    function kick(t, vel) {
      const o = ctx.createOscillator();
      const gn = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.exponentialRampToValueAtTime(0.55 * vel, t + 0.004);
      gn.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
      o.connect(gn).connect(g.drums);
      o.start(t);
      o.stop(t + 0.45);
    }

    function snare(t, vel) {
      noiseHit(t, g.snareBP, 0.55 * vel, 0.17);
      const o = ctx.createOscillator();
      const gn = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = 190;
      gn.gain.setValueAtTime(0.25 * vel, t);
      gn.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      o.connect(gn).connect(g.drums);
      o.start(t);
      o.stop(t + 0.1);
    }

    function hat(t, vel) {
      noiseHit(t, g.hatHP, 0.16 * vel, 0.04);
    }

    // Harder kick: faster pitch drop, longer body, and a tiny click on top.
    function kickHard(t, vel) {
      const o = ctx.createOscillator();
      const gn = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(190, t);
      o.frequency.exponentialRampToValueAtTime(40, t + 0.09);
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.exponentialRampToValueAtTime(0.7 * vel, t + 0.003);
      gn.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o.connect(gn).connect(g.drums);
      o.start(t);
      o.stop(t + 0.55);
      noiseHit(t, g.hatHP, 0.1 * vel, 0.012);
    }

    // Gated snare: noise held at level, then cut off sharply (the reverb send adds the tail).
    function gatedSnare(t, vel) {
      const s = ctx.createBufferSource();
      const gn = ctx.createGain();
      s.buffer = noiseBuf;
      gn.gain.setValueAtTime(0.55 * vel, t);
      gn.gain.linearRampToValueAtTime(0.38 * vel, t + 0.16);
      gn.gain.linearRampToValueAtTime(0.0001, t + 0.19);
      s.connect(gn).connect(g.snareBP);
      s.start(t, Math.random() * 0.8);
      s.stop(t + 0.2);
      const o = ctx.createOscillator();
      const bg = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = 175;
      bg.gain.setValueAtTime(0.3 * vel, t);
      bg.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
      o.connect(bg).connect(g.drums);
      o.start(t);
      o.stop(t + 0.12);
    }

    // ---------------------------------------------------------------
    // Scheduler (16 steps per bar, 4/4)
    // ---------------------------------------------------------------
    function drumsChill(s, jt) {
      if (s === 0) kick(jt, 1);
      else if (s === 6 && Math.random() < 0.4) kick(jt, 0.8);
      else if (s === 10 && Math.random() < 0.35) kick(jt, 0.75);

      if (s === 4 || s === 12) snare(jt, rand(0.85, 1));

      if (s % 2 === 0) hat(jt, s % 4 === 2 ? rand(0.9, 1) : rand(0.4, 0.6));
      else if (Math.random() < 0.15) hat(jt, 0.3);
    }

    // Straight 80s pattern: kick on 1 and 3, big snare on 2 and 4, open hats on the offbeats.
    function drumsSynth(s, jt) {
      if (s === 0 || s === 8) kick(jt, 1);
      else if ((s === 10 || s === 14) && Math.random() < 0.3) kick(jt, 0.7);

      if (s === 4 || s === 12) snare(jt, rand(0.9, 1));

      if (s % 4 === 2) noiseHit(jt, g.hatHP, 0.14, 0.11);        // open hat
      else if (s % 4 === 0) hat(jt, 0.5);
      else if (Math.random() < 0.6) hat(jt, rand(0.15, 0.25));
    }
    // Darksynth: heavy kick on 1 and 3 (plus occasional extras), gated snare on 2 and 4, tight hats.
    function drumsDark(s, jt) {
      if (s === 0 || s === 8) kickHard(jt, 1);
      else if (s === 3 && Math.random() < 0.2) kickHard(jt, 0.7);
      else if ((s === 6 || s === 10 || s === 14) && Math.random() < 0.3) kickHard(jt, 0.8);

      if (s === 4 || s === 12) gatedSnare(jt, rand(0.9, 1));

      if (s % 4 === 2) hat(jt, rand(0.8, 1));
      else if (s % 4 === 0) hat(jt, 0.45);
      else if (Math.random() < 0.7) hat(jt, rand(0.15, 0.3));
    }
    const DRUMS = { chill: drumsChill, synth: drumsSynth, dark: drumsDark };

    function scheduleStep(s, t) {
      const st = STYLES[styleKey];
      if (s % 2 === 1) t += stepDur() * st.swing;          // swing the off-16ths

      if (s === 0) {
	    if (R.on) radioBar(); else updateVariation();
	    playChord(t, !muted("pad"));
	  }

      if (!muted("drums")) DRUMS[st.drums](s, t + rand(-st.jitter, st.jitter));

      if (st.lead === "melody") {
        if (s % 2 === 0 && !muted("melody") && Math.random() < MELODY_DENSITY) playMelody(t);
      } else {
        const bp = BASS_PATTERNS[S.sel.bassPattern || st.bassPattern](s);
        if (bp && !muted("bass")) playBass(t, bp);
        if (s % (st.arpEvery || 1) === 0 && !muted("arp")) playArp(t, s);
      }
    }

    function tick() {
	  if (!playing || !g) return;
	  const now = ctx.currentTime;
	  if (nextTime < now - 0.1) { log("RESYNC late=" + Math.round((now - nextTime) * 1000) + "ms"); nextTime = now + 0.05; }
	  while (nextTime < now + LOOKAHEAD) {
	    try { scheduleStep(step, nextTime); }
	    catch (e) { log("ERR step " + step + ": " + (e && e.message)); }
	    nextTime += stepDur();
	    step = (step + 1) % 16;
	  }
	    if (Date.now() - lastAliveTs > 30000) { lastAliveTs = Date.now(); alive("tick"); }
	    if (Date.now() - lastBeat > 300000) {          // heartbeat every 5 min
	      lastBeat = Date.now();
	      if (silentEl && !silentEl.paused) resumeTries = 0;
	      log("hb " + snap() + " ct=" + Math.round(ctx.currentTime) + diag());
	    }
	  }

    // ---------------------------------------------------------------
    // Settings: per-style memory, saved between visits
    // ---------------------------------------------------------------
    const SAVE_KEY = "chillforge-v3";

    function newState(key) {
      const st = STYLES[key];
      const vol = {};
      chanDefs(st).forEach((c) => { vol[c.id] = c.def; });
      const sel = {};
      st.selects.forEach((s) => { sel[s.id] = s.def; });
      return { bpm: st.bpm.def, vol, sel, prog: st.progs[0] };
    }

    // Copy any valid values from src into store[key]; ignore anything invalid.
    function mergeState(key, src) {
      if (!src) return;
      const st = STYLES[key], d = store[key];
      const bpm = Number(src.bpm);
      if (isFinite(bpm)) d.bpm = clamp(Math.round(bpm), st.bpm.min, st.bpm.max);
      chanDefs(st).forEach((c) => {
        const v = Number(src.vol && src.vol[c.id]);
        if (isFinite(v)) d.vol[c.id] = clamp(Math.round(v), VOL_MIN, c.max);
      });
      st.selects.forEach((s) => {
        const v = src.sel && src.sel[s.id];
        if (s.options.some((o) => o[0] === v)) d.sel[s.id] = v;
      });
      if (st.progs.includes(src.prog)) d.prog = src.prog;
    }

    function loadSettings() {
      Object.keys(STYLES).forEach((k) => { store[k] = newState(k); });
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
          const o = JSON.parse(raw);
          if (STYLES[o.style]) styleKey = o.style;
          Object.keys(STYLES).forEach((k) => mergeState(k, (o.store || {})[k]));
        } else {
          // One-time migration from the old slider-based settings.
          const old = JSON.parse(localStorage.getItem("chillforge-settings") || "null");
          if (old) {
            mergeState("chillwave", {
              bpm: old.bpmSlider, prog: old.progSelect,
              vol: { master: old.masterVol, drums: old.drumsVol, pad: old.padVol, melody: old.melodyVol },
              sel: { padShape: old.padShape, melodyShape: old.melodyShape }
            });
          }
        }
      } catch (e) {}
      S = store[styleKey];
    }

    let saveTimer = null;
    function saveSettings() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify({ style: styleKey, store }));
        } catch (e) {}
      }, 300);
    }

    // ---------------------------------------------------------------
    // UI: steppers (tap, or hold to repeat and speed up)
    // ---------------------------------------------------------------
    let holdStop = null;
    ["pointerup", "pointercancel"].forEach((ev) =>
      window.addEventListener(ev, () => { if (holdStop) holdStop(); }));

    function holdable(btn, fn) {
      btn.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 || btn.disabled) return;
        e.preventDefault();
        fn();
        let n = 0, to;
        const run = () => { fn(); n++; to = setTimeout(run, n > 12 ? 40 : 110); };
        to = setTimeout(run, 400);
        holdStop = () => { clearTimeout(to); holdStop = null; };
      });
      btn.addEventListener("click", (e) => { if (e.detail === 0) fn(); });   // keyboard
      btn.addEventListener("contextmenu", (e) => e.preventDefault());
    }

    function stepperRow(label, get, set, min, max, fmt) {
      const cell = el("div", "cell");
      const lbl = el("div", "lbl"); lbl.textContent = label;
      const ctl = el("div", "ctl");
      const dec = el("button", "step"); dec.textContent = "\u2212"; dec.setAttribute("aria-label", label + " down");
      const val = el("div", "val");
      const inc = el("button", "step"); inc.textContent = "+"; inc.setAttribute("aria-label", label + " up");
      const show = () => {
        val.textContent = fmt(get());
        dec.disabled = get() <= min;
        inc.disabled = get() >= max;
      };
      refreshers.push(show);
      const bump = (d) => () => {
        const v = clamp(get() + d, min, max);
        if (v === get()) return;
        set(v); show(); saveSettings();
      };
      holdable(dec, bump(-1));
      holdable(inc, bump(1));
      show();
      ctl.append(dec, val, inc);
      cell.append(lbl, ctl);
      return cell;
    }

    const fmtDb = (v) => (v <= VOL_MIN ? "Off" : (v > 0 ? "+" : "") + v + " dB");

    function buildControls() {
      refreshers = []; selEls = {};
      const st = STYLES[styleKey], box = $("controls");
      box.textContent = "";

      const cells = el("div", "cells");
      box.appendChild(cells);

      cells.appendChild(stepperRow("Tempo", () => S.bpm, (v) => {
        S.bpm = v;
        if (g) g.delay.delayTime.setTargetAtTime(45 / S.bpm, ctx.currentTime, 0.05);
      }, st.bpm.min, st.bpm.max, String));

      const volCell = (c, label) => stepperRow(label || c.label, () => S.vol[c.id], (v) => {
        S.vol[c.id] = v;
        applyMixer();
      }, VOL_MIN, c.max, fmtDb);

      cells.appendChild(volCell(MASTER, "Volume"));
      cells.appendChild(el("div", "divider"));
      st.channels.forEach((c) => cells.appendChild(volCell(c)));

      box.appendChild(el("div", "divider"));

      st.selects.forEach((s) => {
        const row = el("div", "row sel");
        const lbl = el("div", "lbl"); lbl.textContent = s.label;
        const sel = el("select");
        selEls[s.id] = sel;
        sel.setAttribute("aria-label", s.label + " sound");
        s.options.forEach(([v, text]) => {
          const o = el("option"); o.value = v; o.textContent = text; sel.appendChild(o);
        });
        sel.value = S.sel[s.id];
        sel.addEventListener("change", () => {
          S.sel[s.id] = sel.value;
          if (s.id === "variation" && sel.value === "off") resetVariation();   // Off restores everything immediately
          if (R.on && s.id === "variation") R.base.sel.variation = sel.value;
          saveSettings();
        });
        row.append(lbl, sel);
        box.appendChild(row);
      });
    }

    function fillProgressions() {
      const st = STYLES[styleKey], sel = $("progSelect");
      sel.textContent = "";
      st.progs.forEach((key) => {
        const o = el("option"); o.value = key; o.textContent = PROGRESSIONS[key].label; sel.appendChild(o);
      });
      sel.value = S.prog;
      $("progGroup").hidden = st.progs.length < 2;
    }

    function switchStyle(key) {
      styleKey = key;
	  S = store[key];
	  if (R.on) S = radioClone(S);
	  radioInfo();
	  chordIdx = 0; currentChord = null; lastMelodyNote = null;
      resetVariation();
      buildControls();
      fillProgressions();
      saveSettings();
      if (playing) restartBeat();      // each style has its own audio graph
    }

    // ---------------------------------------------------------------
    // Transport
    // ---------------------------------------------------------------
    function startBeat() {
      yielded = false;
      if (playing) return;
      log("start " + snap());
      if (!ctx) initContext();
      ensureSilentEl();
      ctx.resume();
      log("audio sr=" + ctx.sampleRate + " baseLat=" + (ctx.baseLatency || 0).toFixed(3) + " outLat=" + (ctx.outputLatency || 0).toFixed(3));
      silentEl.play().catch(() => {});
      buildGraph();
      step = 0; chordIdx = 0; currentChord = null; lastMelodyNote = null; arpFreq = null;
      resetVariation();
      if (R.on) { R.n = 0; R.skip = false; radioNewTrack(true); }
      nextTime = ctx.currentTime + 0.1;
      playing = true;
      alive("start");
      timer.start();
      $("playBtn").textContent = "Stop Beat";
      $("playBtn").classList.add("playing");
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
    }

	function stopBeat(why) {
	  if (!playing) return;
	  log("stop: " + (typeof why === "string" ? why : "ui") + " " + snap());
	  playing = false;
	  alive("stop");
	  clearTimeout(resumeTimer); clearTimeout(yieldTimer); yielded = false; resumeTries = 0;
	  timer.stop();
      teardownGraph();
      if (silentEl) silentEl.pause();
      resetVariation();
      radioInfo();
      $("playBtn").textContent = "Start Beat";
      $("playBtn").classList.remove("playing");
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
    }

    // Beat is "playing" on paper but the audio died: rebuild without touching the silent element.
    function restartBeat() {
      playing = false;
      timer.stop();
      teardownGraph();
      startBeat();
    }

    $("playBtn").addEventListener("click", () => (playing ? stopBeat() : startBeat()));
	$("radioBtn").addEventListener("click", () => setRadio(!R.on));
	$("nextBtn").addEventListener("click", () => { if (R.on && playing) R.skip = true; });

    // ---------------------------------------------------------------
    // Init
    // ---------------------------------------------------------------
    loadSettings();

    const styleSelect = $("styleSelect");
    Object.keys(STYLES).forEach((key) => {
      const o = el("option"); o.value = key; o.textContent = STYLES[key].label; styleSelect.appendChild(o);
    });
    styleSelect.value = styleKey;
    styleSelect.addEventListener("change", (e) => switchStyle(e.target.value));

    $("progSelect").addEventListener("change", (e) => {
      S.prog = e.target.value; chordIdx = 0; resetVariation(); saveSettings();
    });

    buildControls();
    fillProgressions();

    // Bluetooth / lock-screen controls
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Chillforge",
          artist: "Generative lo-fi beat",
          artwork: [
            { src: "app-icons/app-icon-192.png", sizes: "192x192", type: "image/png" },
            { src: "app-icons/app-icon-512.png", sizes: "512x512", type: "image/png" }
          ]
        });
        navigator.mediaSession.setActionHandler("play", () => { log("ms play " + snap()); playing ? restartBeat() : startBeat(); });
		navigator.mediaSession.setActionHandler("pause", () => stopBeat("ms pause"));
		navigator.mediaSession.setActionHandler("stop", () => stopBeat("ms stop"));
      } catch (e) {}
    }

	document.addEventListener("visibilitychange", () => {
	  log("vis " + document.visibilityState + " " + snap());
	  if (document.hidden || !playing) return;
	  if (silentEl && silentEl.paused && !yielded) silentEl.play().catch(() => stopBeat("visible, el paused"));
	  if (ctx.state !== "running") ctx.resume().catch(() => {});
	});
	document.addEventListener("freeze", () => log("page freeze"));
	document.addEventListener("resume", () => log("page resume"));
	window.addEventListener("pagehide", () => { log("pagehide"); alive("pagehide"); });
	window.addEventListener("error", (e) => log("ERR " + e.message));
	window.addEventListener("unhandledrejection", () => log("ERR unhandled rejection"));
	log("boot " + snap());

	$("ver").addEventListener("click", () => {
	  const p = $("dbg");
	  p.hidden = !p.hidden;
	  if (!p.hidden) {
	    p.textContent = LOG.slice(-150).reverse().join("\n");   // newest first
	    if (navigator.clipboard) navigator.clipboard.writeText(LOG.join("\n")).catch(() => {});
	  }
	});

    // PWA: offline support / installability
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js")
          .catch((err) => console.warn("Service worker registration failed:", err));
      });
    }
  </script>
</body>
</html>
